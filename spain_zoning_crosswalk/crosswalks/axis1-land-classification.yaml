      important consequence: under a non-adapted plan, bare `suelo no
      urbanizable` does NOT default to the ordinary category. It defaults to a
      PROTECTED one. The four legacy rows below carry DT quinta as their
      article.

      2019 IS A FINDING, NOT AN OMISSION. art. 83.2 was derogated by art. 22.5
