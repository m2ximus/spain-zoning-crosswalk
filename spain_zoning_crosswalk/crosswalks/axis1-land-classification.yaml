          Second, the false friend, confirmed three ways: (1) art. 83.1.c)
          defines the category by "el principio de utilización racional de los
          recursos naturales" and closes "Se incluirán en esta categoría los
          terrenos que no resulten necesarios o idóneos para su transformación
          urbanística" — the residual bucket; (2) the preámbulo says it in terms,
          "salvo el supuesto del suelo no urbanizable inadecuado que no es objeto
          de protección"; (3) art. 178 ff. permits an urbanistic convenio to
          change classification only where it has "por objeto el cambio de
          clasificación de suelo no urbanizable inadecuado a suelo urbanizable"
          — the one rural category the law lets a convenio promote.
          `inadecuado` in Murcia means NOT NEEDED FOR GROWTH, not *unfit*.
          Reading it as a degraded or protected category inverts the answer.
      - local: suelo no urbanizable de protección específica
        canonical: RURAL_PROTECTED
        article: art. 83.1.a)
        protection_basis: [environmental, interest, risk, coastal, infrastructure, sectoral]
        note: >
          Triggered where the land is subject to "algún régimen específico de
          protección incompatible con su transformación urbanística, de
          conformidad con los instrumentos de ordenación territorial, de
          ordenación de recursos naturales y la legislación sectorial
          específica", on grounds paisajísticos, históricos, arqueológicos,
          científicos, ambientales or culturales, "para la prevención de riesgos
          naturales o tecnológicos acreditados", or by dominio público
          servitudes. Genuinely a list, hence six values.
          CAUTION, and it is the permanent hard stop: this category is DEFINED BY
          the sectoral and territorial layer, which does not license reading that
          layer onto the class. The row records what the statute says; the
          verdict still needs the plan's own classification. A protection overlay
          may never by itself put a parcel in RURAL_PROTECTED.
      - local: suelo no urbanizable protegido por el planeamiento
        canonical: RURAL_PROTECTED
        article: art. 83.1.b)
        protection_basis: [plan, economic, infrastructure]
        note: >
          THE SINGLE LARGEST GAP IN THIS BLOCK BEFORE v0.2.0: a whole statutory
          category of protected rural land with no row at all, which in
          production means an unmatched string, which by this file's own doctrine
          is a silent miss. art. 83.1.b) is protection decided by the plan
          ITSELF — as opposed to 83.1.a)'s protection imposed from outside — "por
          sus valores de carácter agrícola, incluso las huertas tradicionales,
          forestal, ganadero, minero, paisajístico o por otras riquezas
          naturales, así como aquellos que se reserven para la implantación de
          infraestructuras o servicios públicos".
          Note `minero` on the protected side here, against Valencia's ZRC-EX,
          where extractive land is common rural. Two regions, opposite answers,
          same physical fact.
      - local: suelo urbano
        canonical: URBAN_CONSOLIDATED
        article: DT quinta.a)
        legacy: true
        note: >
          Non-adapted plans. DT quinta.a) gives bare `suelo urbano` the régimen
          of suelo urbano CONSOLIDADO, except within delimited unidades de
          ejecución or actuación, which take the sin consolidar régimen (with the
          art. 86.2 exception). The row maps the default; the exception cannot be
          read off the string and needs the plan.
      - local: suelo no urbanizable
        canonical: RURAL_PROTECTED
        article: DT quinta.b)
        legacy: true
        protection_basis: [plan]
        flag: resolve_by_sectoral_check
        note: >
          THE ROW THAT WOULD HAVE BEEN BACKWARDS. Under a plan never adapted to
          the 2005 refundido, DT quinta.b) gives bare `suelo no urbanizable` the
          régimen of PROTEGIDO POR EL PLANEAMIENTO — not of the ordinary
          category — except where the land is protected by sectoral legislation
          or territorial instruments, in which case it takes protección
          específica. Both branches are protected; the flag marks which of the
          two, not whether. Mapping the most common legacy string in the region
          to RURAL_ORDINARY, as a label reading would, gets it exactly wrong.
      - local: suelo urbanizable programado
        canonical: DEVELOPABLE_SECTORED
        article: DT quinta.c)
        legacy: true
      - local: suelo urbanizable no programado
        canonical: DEVELOPABLE_UNSECTORED
        article: DT quinta.c)
        legacy: true
      - local: suelo apto para urbanizar
        canonical: DEVELOPABLE_UNSECTORED
        article: DT quinta.c)
        legacy: true
        flag: resolve_by_sector_delimitation
        note: >
          DT quinta.c) sends this to sin sectorizar "excepto que estuviese
          expresamente delimitado como sector para su desarrollo mediante un
          único plan parcial", in which case sectorizado. The string does not
          say which, so the row carries the default and the flag; the plan
          settles it. This is the NNSS vocabulary a pre-2005 Murcian municipality
          actually carries.

