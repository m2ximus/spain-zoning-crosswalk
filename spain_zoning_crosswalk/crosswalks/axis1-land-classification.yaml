      THE STRUCTURAL OUTLIER. General plans and planes básicos municipales
      classify municipal territory into urbano, de núcleo rural, urbanizable
      and rústico. Núcleo rural is a FULL LAND CLASS, not a category — unique
      in Spain — retained as characteristic of the Galician settlement system.
      Ley 2/2016 categorised it into tradicional and común, eliminating the
      former "complexo" category.
      Also note the Plan Básico Autonómico: a regional plan that supplies
      classification for municipalities under 5,000 inhabitants without their
      own general plan, via planes básicos municipales. This is a partial
      solution to Galicia's coverage gap and should be ingested as a fallback
      source before marking a Galician municipality "no plan found".

      art. 15 verbatim: the plan classifies land as "urbano, de núcleo rural,
      urbanizable y rústico". Four classes, and núcleo rural is listed as a
      peer of the other three — which is why its settlement_position is
      own_class and why Galicia is the only region where that value is used.

      GALICIA HAS THE CLEANEST ORDINARIO/PROTEGIDO SPLIT IN SPAIN, and it is
      the one region where that axis is resolved by the CLASS rather than by
      looking the parcel up in a plan. art. 31.2, verbatim: "Dentro do solo
