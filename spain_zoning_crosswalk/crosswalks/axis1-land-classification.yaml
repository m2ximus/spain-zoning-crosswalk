      Galicia or the Illes Balears in renaming the class. Any row in this region
      carrying `rústico` is a leak by construction.

      NÚCLEO RURAL IS URBAN LAND HERE, AND THIS FILE NOW SAYS SO. art. 81.4
      verbatim: "Tendrán la consideración de suelo urbano de núcleo rural los
      terrenos, incluidos los de la huerta tradicional de la Región de Murcia,
