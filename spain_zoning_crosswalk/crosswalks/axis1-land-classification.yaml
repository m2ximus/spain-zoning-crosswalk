        article: arts. 84.2, 102.d), 123.1, 136
        rural_settlement: false
        flag: ambiguous_since_2025_06_08
        note: >
          MISSING FROM THIS FILE BEFORE v0.2.0, and the row where effect-mapping
          earned its keep. art. 84.2: "terrenos específicos, incluidos los de la
          huerta tradicional, con peculiares características de asentamientos
          existentes, con urbanización parcial y especial entorno ambiental, que
