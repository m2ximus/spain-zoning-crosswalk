  # === CANTABRIA =========================================================
  - region: Cantabria
    ine_ca_code: "06"
    languages: [es]
    law:
      citation: Ley de Cantabria 5/2022, de 15 de julio, de Ordenación del Territorio y Urbanismo de Cantabria
      eli: https://www.boe.es/eli/es-cb/l/2022/07/15/5/con
      boe_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2022-13844
      class_article: art. 34
      in_force_from: 2022-09-22
      supersedes: Ley de Cantabria 2/2001
      amended_by: Ley de Cantabria 3/2023, de 26 de diciembre, art. 23 (BOE-A-2024-1373), in force 2024-01-01
    class_count: 3
    confidence: verified
    verified_at_version: "0.2.0"
    verified_against: >
      https://www.boe.es/eli/es-cb/l/2022/07/15/5/con (consolidado as updated
      30/04/2026) AND the enacted facsimile BOE-A-2022-13844 (BOE núm. 197, de
      17/08/2022) AND five BOE consolidated versions diffed against each other
      (p=20221229, 20231229, 20241230, 20250404, 20260430).
    verified_on: 2026-08-16
    verified_note: >
      Cantabria is the region where reading only the current consolidated text
      would have produced a row that is right today and wrong for every plan
      approved before 2024. It needed the ENACTED text as well, and then a
      version diff to find the boundary. That is why three grades are listed
      above and why this region took the longest.
      Articles read: 34 (classes), 35, 37, 38, 42, 46, 49, 50, 51, 86, 87,
      111.1, the preamble passages on urbano and urbanizable, and DF novena.
      In Ley 3/2023: apartados Dos, Cinco, Ocho and Trece of art. 23.
      The version diff establishes the núcleo rural boundary exactly: art. 46.4
      is present only in the 20221229 version and art. 37.1.e) is absent only
      in that version, so the change lands on the 2023-12-29 text and takes
      effect 2024-01-01 per Ley 3/2023 DF segunda ("entrará en vigor el día 1
      de enero 2024").
      LIMIT: art. 46.1's enumeration of especial protección grounds was read for
      letter b) (riesgos) but not transcribed letter by letter, so the
      protection_basis on that row is stated conservatively and marked as such.
    notes: >
      Art. 34 sets the three classes and, contrary to what this file said before
      v0.2.0, lists NO categories at all. The article numbering here was off by
      one step: art. 46.1 CLASSIFIES especial protección and art. 46.3
      CLASSIFIES protección ordinaria, while arts. 49 and 50 are the RÉGIMEN
      articles. Both are now cited, classification first.

      THE CONTESTED FLAG RESOLVES, AND NEITHER SIDE WAS RIGHT. The preamble does
      say "Se suprime la distinción entre el suelo urbano consolidado y el no
      consolidado" — true, as a statutory class category. But the operative text
      keeps the label alive as a PLAN QUALIFICATION: "los terrenos del suelo
      urbano que el Planeamiento General califique como suelo urbano no
      consolidado". So label_abolished is correct AND the term still has to
      resolve, which is exactly why both rows are below. The commentary that
      said art. 34 retained the distinction was wrong about the article; the
      preamble reading was wrong about the consequence.

      NÚCLEO RURAL CHANGED CLASS ON 2024-01-01. This is the single most
      important vintage fact in the file. As enacted, art. 46.4 defined núcleos
      rurales as "aquellos ámbitos así definidos por el planeamiento general
      que, no contando con los requisitos legalmente establecidos para ser
      clasificados como suelo urbano…" — a figure WITHIN suelo rústico, with its
      régimen at art. 51, and the preamble agreeing that they "encajan mejor en
      cuanto a su concepción y regulación en el suelo rústico que en el suelo
      urbano". Ley 3/2023 art. 23 then suppressed art. 46.4 (apartado Ocho),
      made núcleo rural a situation of SUELO URBANO at a new art. 37.1.e)
      (apartado Dos), put the characteristic use "residencial vinculado al medio
      rural" at a new art. 38.6 (apartado Cinco), and rewrote art. 51 as
      "Construcción de viviendas y otras actuaciones en suelo rústico"
      (apartado Trece). Cantabria therefore joins Murcia as a second region
      where a rural settlement sits inside urban land — and a Cantabrian plan
      approved between 2022-09-22 and 2023-12-31 says the opposite.

      DEFECT IN THE ENACTED TEXT, recorded because someone will hit it: the same
      Ley 3/2023 that deleted art. 46.4 left the phrase "los núcleos rurales a
      los que se refiere el artículo 46.4" standing in art. 51.2, and art. 86.1
      keeps its own reference. Two dangling cross-references to a repealed
      apartado. Recorded, not resolved: it does not change which article
      classifies, which is art. 37.1.e).

      ÁREAS DE DESARROLLO RURAL ARE NOT SETTLEMENTS, and mapping them to
      RURAL_SETTLEMENT (as this file did before v0.2.0) overstated the rights.
      art. 86.1 is decisive: an ADR may only be delimited on rústico that does
      NOT hold the art. 46.1 values, and only "en el entorno de los núcleos
      urbanos y rurales delimitados". It is an overlay on ordinary rústico that
      unlocks vivienda unifamiliar aislada in small or depopulating
      municipalities — commercially significant, but a permission, not a class.

      Art. 35, as amended in 2024: "En los municipios sin planeamiento general,
      el suelo se clasifica en suelo rústico de especial protección y en suelo
      urbano." No plan is not the absence of a class; it is a two-class region
      for those municipalities, and it matters to the coverage ladder.

      Art. 111.1: a plan takes effect on complete BOC publication AND, for
      municipally approved plans, the lapse of the art. 65.2 LBRL period. Two
      conditions, not one.
    mappings:
      - local: suelo urbano
        canonical: URBAN_CONSOLIDATED
        article: art. 37
        label_abolished: true
        note: >
          The consolidado/no consolidado distinction is suppressed as a
          statutory category, so bare `suelo urbano` is the class and behaves as
          consolidated land unless the plan qualifies it otherwise.
      - local: suelo urbano no consolidado
        canonical: URBAN_UNCONSOLIDATED
        label_abolished: true
        note: >
          Not a statutory category after 2022, but still a live plan
          qualification: the operative text speaks of "los terrenos del suelo
          urbano que el Planeamiento General califique como suelo urbano no
          consolidado". No article is cited because the qualification is
          scattered rather than defined in one place, and a guessed citation
          would be worse than none.
      - local: suelo urbanizable
        canonical: DEVELOPABLE_SECTORED
        article: art. 42
        valid_from: 2022-09-22
        note: >
          art. 42 gives urbanizable no categories; art. 42.2 lets the Plan
          General divide it into Sectores. One class, sectored by the plan.
      - local: suelo urbanizable delimitado
        canonical: DEVELOPABLE_SECTORED
        legacy: true
        note: >
          Ley 2/2001 vocabulary, not art. 42. Preamble: the law integrates
          urbanizable "eliminando la distinción que establecía la legislación
          anterior entre suelo urbanizable delimitado y residual, por cuanto
          éste último carece de sentido conforme al principio de desarrollo
          sostenible." Kept because unadapted plans still carry it.
      - local: suelo urbanizable residual
        canonical: DEVELOPABLE_UNSECTORED
        legacy: true
        note: >
          Ley 2/2001 vocabulary. Note the string: Cantabria says `residual`,
          not `no delimitado` — a crosswalk that normalised it to the commoner
          term would stop matching.
      - local: núcleo rural
        canonical: RURAL_SETTLEMENT
        article: art. 46.4
        settlement_position: within_rural
        valid_from: 2022-09-22
        valid_to: 2023-12-31
        note: >
          THE ENACTED POSITION. A figure within suelo rústico, régimen at the
          original art. 51. Superseded by the row below on 2024-01-01, but a
          plan approved in this window says this, and it must still resolve.
      - local: núcleo rural
        canonical: URBAN_CONSOLIDATED
        article: arts. 37.1.e), 38.6
        rural_settlement: true
        valid_from: 2024-01-01
        note: >
          THE CURRENT POSITION, and a change of CLASS rather than of category:
          Ley 3/2023 art. 23 (Ocho) suppressed art. 46.4 and (Dos) made núcleo
          rural a situation of suelo urbano. The characteristic use is
          "residencial vinculado al medio rural" (art. 38.6, added by apartado
          Cinco) — so this file's old note about that use belonged at 38.6, not
          at art. 51.
          THE CANONICAL VALUE FOLLOWS THE CLASS, NOT THE NAME. Once the statute
          puts the figure inside suelo urbano, RURAL_SETTLEMENT would be
          Galicia's concept imported into Cantabria, and ingest matches on the
          class the plan writes. The `rural_settlement` flag carries the fact
          that this is a recognised rural settlement with its own régimen; the
          canonical carries what the holder can do. Same treatment as Región de
          Murcia arts. 81.4 and 81.5 — and note that this makes the pre-2024
          row above a change of CANONICAL as well as of position, which is
          exactly why the vintage split exists.
          URBAN_CONSOLIDATED rather than URBAN_UNCONSOLIDATED because Cantabria
          abolished that distinction as a category (see the two urbano rows) —
          it is the same choice made for bare `suelo urbano`, not a finding
          about servicing.
      - local: área de desarrollo rural
        canonical: RURAL_ORDINARY
        article: arts. 86, 87
        adr: true
        protection_basis: none
        note: >
          RECLASSIFIED at v0.2.0, from RURAL_SETTLEMENT. An ADR is an overlay on
          ordinary rústico, not a settlement: art. 86.1 permits it only on land
          that does NOT hold the art. 46.1 values and only "en el entorno de los
          núcleos urbanos y rurales delimitados". A 2022 anti-depopulation
          figure that unlocks detached single-family housing; art. 87 adds the
          small-municipality variant. Carry it as the `adr` flag alongside the
          class, not instead of it.
      - local: suelo rústico de protección ordinaria
        canonical: RURAL_ORDINARY
        article: arts. 46.3, 50
      - local: suelo rústico de especial protección
        canonical: RURAL_PROTECTED
        article: arts. 46.1, 49
        protection_basis: [environmental, risk, sectoral]
        note: >
          art. 46.1.b) is riesgos, read directly — Cantabria puts risk land in
          ESPECIAL protección where Galicia puts it in ordinaria. The rest of
          art. 46.1's enumeration was read but not transcribed letter by
          letter, so this basis list is stated conservatively and may be
          incomplete; it is not a claim that no other ground applies.

