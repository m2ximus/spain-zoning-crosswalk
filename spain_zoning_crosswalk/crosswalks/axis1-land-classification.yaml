  # === EXTREMADURA =======================================================
  - region: Extremadura
    ine_ca_code: "11"
    languages: [es]
    law:
      citation: Ley 11/2018, de 21 de diciembre, de ordenación territorial y urbanística sostenible de Extremadura (LOTUS)
      eli: https://www.boe.es/eli/es-ex/l/2018/12/21/11/con
      boe_url: https://www.boe.es/buscar/doc.php?id=BOE-A-2019-1790
      class_article: art. 6.1
      in_force_from: 2019-06-27
      supersedes: Ley 15/2001 (LSOTEX)
    class_count: 3
    confidence: verified
    verified_at_version: "0.2.0"
    verified_against: https://www.boe.es/eli/es-ex/l/2018/12/21/11/con (consolidado as updated 23/09/2025)
    verified_on: 2026-08-16
    verified_note: >
      Articles read: 6 (all four apartados), 9 (all three apartados), 67, 71
      (all three apartados), the preamble passage on abandoned vocabulary, and
      DF segunda. Extremadura legislates in Castilian, so the consolidated text
      is in the language the law binds in and no regional-gazette fetch was
      needed for vocabulary.
      This region was flagged in the brief as THE TRAP — categories supposedly
      unnamed in statute and left entirely to the plan. It is a trap, but not
      that one: the categories ARE named, at art. 9.2, and one of them was
      missing from this file altogether. What is plan-resolved is the
      ASSIGNMENT (art. 9.1), not the vocabulary.
      Entry into force is a computation from the DOE date in BOE's own header:
      DF segunda reads "Esta ley entrará en vigor a los seis meses de su
      publicación en el Diario Oficial de Extremadura" and the header gives
      «DOE» núm. 250, de 27/12/2018.
      LIMIT: LSOTEX's own entry-into-force day was not read, so the legacy rows
      below carry `legacy: true` and no valid_from/valid_to pair.
    notes: >
      CORRECTION TO A COMMON ASSUMPTION: LOTUS did NOT abolish urbanizable.
      It classifies land as urbano, urbanizable and rústico. What it did was
      abandon the no consolidado category and eliminate the "no urbanizable"
      denomination in favour of "rústico", making rústico the basic category of
      municipal land. Extremadura is a three-class region, not a two-class one.
      Art. 67 systematises rústico uses as: naturales, vinculados, permitidos,
      autorizables, prohibidos — a five-tier permission ladder that maps well
      onto the axis-2 permitted/conditional/prohibited model.

      Preamble, verbatim, confirming both abandonments in one sentence: "Se
      abandona la categoría de no consolidado y se reconoce el suelo rústico
      como la categoría básica del conjunto del suelo municipal, abandonando la
      desacertada denominación de no urbanizable."

      art. 9 IS THE OPERATIVE ARTICLE, NOT ART. 71 — and art. 9.2 names three
      categories where this file carried two:
        a) suelo rústico protegido — ecológicos, naturales, paisajísticos,
           culturales y análogos
        b) suelo rústico restringido — vulnerability to riesgos
        c) suelo rústico con asentamiento tradicional
        d) further subcategories may be added by reglamento
      Letter b) was missing from this file entirely. Extremadura is the only
      region of the eleven that gives risk-based land a category NAME of its
      own; Galicia folds the same fact into protección ordinaria and Cantabria
      into especial protección.

      ART. 9.3 IS QUOTABLE SUPPORT FOR THE PERMANENT HARD STOP. Sectoral
      protection stays as superposed "zonas de afección", expressly "con
      independencia de la categorización" — a textbook statutory statement that
      an overlay is not a class. Cite it whenever someone proposes deriving
      RURAL_PROTECTED from a protection layer.

      ART. 71 IS A DIFFERENT FIGURE and belongs on another axis. 71.1 defines an
      asentamiento by density and occupation exceeding rústico sustainability
      standards while staying below urban ones; 71.2 lets Planes Territoriales
      CREATE new asentamientos, including on private initiative, expressly
      without urban transformation; 71.3 makes Planes Generales Municipales
      delimit "asentamientos irregulares" — "los generados por actos carentes de
      legitimación, sobre los que no cabe la actuación disciplinaria de
      restauración" — in sectors, to regularise the viable ones. That last one
      is Extremadura's analogue of the Andalusian AFO: a regularisation route
      for time-barred illegal building. It is not a land class and must not be a
      RURAL_SETTLEMENT row. It belongs on the axis that carries AFO.
    mappings:
      - local: suelo urbano
        canonical: URBAN_CONSOLIDATED
        article: arts. 6.1, 6.2
        label_abolished: true
        valid_from: 2019-06-27
        note: no consolidado category abandoned by LOTUS
      - local: suelo urbanizable
        canonical: DEVELOPABLE_SECTORED
        article: art. 6.3
        valid_from: 2019-06-27
      - local: suelo rústico
        canonical: RURAL_ORDINARY
        article: art. 6.4
        previous_local: suelo rústico (común)
        valid_from: 2019-06-27
        note: >
          CORRECTED at v0.2.0. "Común" occurs ZERO times in LOTUS; the
          parenthesis was invented, and it is Castilian-León and Canarian
          vocabulary rather than Extremaduran. The residual role is stated
          positively at art. 6.4: "El suelo rústico es la categoría básica del
          conjunto del suelo municipal. Está integrado por los terrenos no
          clasificados como suelo urbano o suelo urbanizable…" — so the ordinary
          case here is the bare class name with no qualifier at all.
          `protección ordinaria` also occurs zero times and is correctly absent;
          do not add it to make Extremadura look like Galicia.
      - local: suelo rústico protegido
        canonical: RURAL_PROTECTED
        article: art. 9.2.a)
        protection_basis: [environmental, interest, plan]
        valid_from: 2019-06-27
        note: >
          Grounds at art. 9.2.a): valores ecológicos, naturales, paisajísticos,
          culturales y análogos. `plan` is included because art. 9.1 assigns the
          categories through the Plan General Municipal or the Plan de Suelo
          Rústico — the names are statutory, the assignment is not.
      - local: suelo rústico restringido
        canonical: RURAL_PROTECTED
        article: art. 9.2.b)
        protection_basis: [risk]
        valid_from: 2019-06-27
        note: >
          ADDED at v0.2.0 — this row was missing entirely. Land restricted for
          vulnerability to riesgos. It is protected FROM building rather than
          FOR a value, which is why protection_basis exists and why RURAL_
          PROTECTED cannot be read as "there is something here worth keeping".
      - local: suelo rústico con asentamiento tradicional
        canonical: RURAL_SETTLEMENT
        article: art. 9.2.c)
        settlement_position: within_rural
        valid_from: 2019-06-27
        note: >
          ARTICLE CORRECTED at v0.2.0, from art. 71. See the region notes: art.
          71 is the asentamientos/asentamientos irregulares figure, a
          regularisation route rather than a class, and citing it here conflated
          a category of rústico with Extremadura's AFO analogue.
      - local: suelo no urbanizable
        canonical: RURAL_ORDINARY
        legacy: true
        note: >
          LSOTEX (Ley 15/2001) vocabulary, expressly abandoned by LOTUS as
          "desacertada". A pre-2019 Extremaduran plan carries it. No valid_to is
          asserted because unadapted plans stay in force; no valid_from because
          LSOTEX's entry-into-force day was not read.
      - local: suelo urbano no consolidado
        canonical: URBAN_UNCONSOLIDATED
        legacy: true
        label_abolished: true
        note: >
          LSOTEX vocabulary, and exactly the category LOTUS abandoned. Kept so
          that a pre-2019 plan still resolves.

