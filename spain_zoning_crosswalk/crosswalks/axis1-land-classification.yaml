# Casas Unitas — Crosswalk Axis 1: Land classification (clasificación del suelo)
# Version: see meta.version below — the single source of truth in this file,
# kept equal to pyproject.toml's version by validate.py (CI fails on drift).
# Maps the land-classification vocabulary of all 17 Spanish autonomous communities
# onto a single canonical enum defined by LEGAL EFFECT, not by label.
#
# GOVERNING PRINCIPLE
#   Never map by label. Map by the answer to: "what can the holder of this land do?"
#     - Can they build on the plot now?                    -> URBAN_*
#     - Only after a transformation process?               -> DEVELOPABLE_*
#     - Essentially not, except authorised rural uses?     -> RURAL_*
#     - Is this a recognised rural settlement where
#       residential building is specifically permitted?    -> RURAL_SETTLEMENT
#
# Labels move between levels (class vs category) when regional laws are rewritten.
# Legal effect is far more stable. Andalucía abolished "urbanizable" as a class in
# 2021 but the transitional state still exists one level down. Map the state.
#
# CONFIDENCE
#   verified          - regional law text or BOE consolidated text checked directly
#   high              - checked against secondary legal sources, consistent
#   needs_review      - drafted from general knowledge, MUST be checked against the
#                       BOE consolidated text before production use
#
# NOTHING IN THIS FILE IS LEGAL ADVICE. Every row that reaches production must carry
# its source article and be re-verified. Regional urbanism laws are rewritten often.

meta:
  version: 0.2.0
  axis: 1
  axis_name: land_classification
  updated: 2026-08-16
  canonical_count: 7
  regions_covered: 17
  license: CC-BY-4.0
  note: >
    Published openly as the standards contribution. The resolved per-plot data
    built on top of it is the commercial product.

  # --- Schema pinning -----------------------------------------------------
  # INSPIRE changed the Planned Land Use schema MATERIALLY within version 4.0
  # without bumping the version number. Implementers had to review transformation
  # projects and republish. A bare "4.0" is therefore not a pin — it is a guess.
  # Record the revision, the date observed, and the URL it was read from.
  schemas:
    inspire_plu:
      version: "4.0"
      revision: UNPINNED
      revision_observed: null
      source_url: https://inspire-mif.github.io/technical-guidelines/data/lu/dataspecification_lu.pdf
      action_required: >
        Pin before ingesting any PLU data. Murcia's pilot will have been built
        against whichever revision was current when they started; if we assume
        a different one we get silent field mismatches, not errors.
    hilucs:
      codelist_url: http://inspire.ec.europa.eu/codelist/HILUCSValue/
      version: UNPINNED
      note: extensible codelist; national extensions are permitted and expected

# ---------------------------------------------------------------------------
# VERSIONING AND CHANGE SURVEILLANCE
# ---------------------------------------------------------------------------
# Three independent things change, at three different rates, breaking three
# different parts of the system. They must be versioned separately.
#
#   TIER 1  SCHEMA      what shape the data is in
#   TIER 2  LAW         what the words mean          <- this file
#   TIER 3  PLAN        what the polygons say
#
# A single "last_updated" field cannot express this. A plan can be revised under
# an unchanged law, a law can change without any plan being revised yet, and the
# schema can change without either. All three states are normal.

versioning:

  tier_1_schema:
    what_changes: INSPIRE PLU / HILUCS data specification
    sources: 1 (European Commission)
    frequency: rare — years
    blast_radius: every ingested dataset simultaneously
    breaks: field names, types, codelist values
    detection: manual review of the technical guidelines; no change feed
    danger: >
      HIGHEST SEVERITY, LOWEST FREQUENCY. Changed silently inside 4.0 once
      already. Failure mode is silent field mismatch, not a crash.
    required_fields_on_data: [plu_schema_version, plu_schema_revision]

  tier_2_law:
    what_changes: regional urbanism law — the vocabulary itself
    sources: 17
    frequency: every few years per region; roughly one region per year in aggregate
    recent_examples:
      - Extremadura 2018 (LOTUS, Ley 11/2018) — renamed no urbanizable to rústico
      - Andalucía 2021 (LISTA, Ley 7/2021) — abolished urbanizable as a class
      - Cantabria 2022 (Ley 5/2022) — replaced the 2001 law
    blast_radius: one region, but every municipality within it
    breaks: THIS FILE. New terms appear, old terms become legacy.
    detection: >
      BOE and the 17 regional official bulletins. Tractable: 18 feeds.
      Watch for "ley de urbanismo", "ordenación del territorio", "ley del suelo".
    critical_rule: >
      A law change does NOT retroactively reclassify existing plans. Plans
      approved under the old law stay under the old law until revised. This is
      why both vocabularies must be retained (see legacy: true rows in
      Andalucía) and why resolution happens against the LAW VINTAGE of the
      plan, never against today's law. See OQ-3.
    required_fields_on_data: [law_in_force_at_approval, crosswalk_version]

  tier_3_plan:
    what_changes: the municipal plan — polygons and rules
    sources: ~8,131
    frequency: >
      CONSTANT. Full revisions every 10-20 years per municipality, but
      modificaciones puntuales run continuously. Across 8,131 municipalities
      this means something changes essentially every working day.
    blast_radius: one municipality, sometimes one sector
    breaks: the data, not the schema or the vocabulary
    detection: >
      THE KEY INSIGHT — do not monitor 8,131 town halls. A plan does not enter
      into force until its normative text is published in the Boletín Oficial
      de la Provincia (LBRL art. 70.2). That means the ~50 provincial bulletins
      are the complete legal change feed for the entire country. Fifty sources,
      not eight thousand. Regional registries (RPUC, SITUA, PLAU) are the
      secondary feed and usually carry the documents.
    required_fields_on_data: [plan_approval_date, bop_publication_date, bop_url, last_verified_at]

  tier_0_source_dataset:
    what_changes: the upstream file we downloaded, republished at the same URL
    note: >
      Not a legal change, but breaks ingest just as effectively. SIU bulk
      shapefiles are date-stamped in the filename and the date changes. The MUC
      updates every six months. Catastro ATOM refreshes roughly every 6 months.
    detection: content-hash every download; alert on change, do not auto-ingest
    required_fields_on_data: [source_url, source_fetched_at, source_sha256]

change_surveillance:
  principle: >
    Every ingested record carries the version of all four tiers it was produced
    under. When any tier moves, we can compute exactly which records are stale
    instead of re-ingesting the country.
  feeds:
    - name: BOE
      tier: 2
      url: https://www.boe.es/
      note: consolidated texts; also carries regional laws
    - name: 17 regional official bulletins
      tier: 2
      note: BOJA, DOGC, DOG, BOPV, DOE, BOC, BOCM, BORM, BON, BOA, BOCyL, DOCM, BOIB, BOC-Canarias, BOR, DOGV, BOPA
    - name: ~50 Boletines Oficiales de la Provincia
      tier: 3
      note: >
        The legal entry-into-force feed for municipal planning. Highest-value
        monitoring target in the entire project. Most publish daily PDFs; some
        have RSS or open-data endpoints.
    - name: Regional planning registries
      tier: 3
      note: RPUC (Catalunya), SITUA (Andalucía), PLAU (CyL), SIOTUGA (Galicia), etc.
    - name: SIU bulk downloads
      tier: 0
      url: https://www.mivau.gob.es/urbanismo-y-suelo/sistema-de-informacion-urbana
      note: filenames are date-stamped; scrape the page, never hardcode the URL
  staleness_policy:
    free_tier: show data with visible plan date and last_verified_at
    pro_tier: >
      Do not serve a regulation whose plan has an unresolved BOP change more
      recent than last_verified_at. Show "a modification was published on
      [date], we are processing it" and link the BOP entry. Being honestly
      behind beats being confidently wrong when someone is deciding whether to
      buy land.

# ---------------------------------------------------------------------------
# CANONICAL ENUM
# ---------------------------------------------------------------------------

canonical:

  - code: URBAN_CONSOLIDATED
    label_en: Urban, consolidated
    label_es: Suelo urbano consolidado
    effect: >
      Serviced, integrated into the urban fabric. Building permitted directly
      subject to the zone's parameters. No further planning instrument needed.
    user_facing: "You can apply to build now."
    hilucs_note: Use is set by axis 2, not by this value.

  - code: URBAN_UNCONSOLIDATED
    label_en: Urban, unconsolidated
    label_es: Suelo urbano no consolidado
    effect: >
      Inside urban land but requires urbanisation works and/or equidistribution
      before building. Owner bears cession and cost duties.
    user_facing: "Urban, but development duties must be completed first."
    caution: >
      Several regions have ABOLISHED this label while retaining the underlying
      distinction (Andalucía 2021, Extremadura 2018, Cantabria 2022 preamble).
      Where abolished, the distinction survives in the definition of urban land
      or in the type of actuación. Do not assume absence of the label means
      absence of the duty. Flag these as URBAN_CONSOLIDATED with
      `label_abolished: true` and surface the actuación type instead.

  - code: DEVELOPABLE_SECTORED
    label_en: Developable, sectored
    label_es: Suelo urbanizable delimitado / sectorizado
    effect: >
      Earmarked for transformation AND delimited into sectors. Requires a plan
      parcial plus urbanisation before building.
    user_facing: "Approved for future development. Years away, not decades."

  - code: DEVELOPABLE_UNSECTORED
    label_en: Developable, unsectored
    label_es: Suelo urbanizable no delimitado / no sectorizado / residual
    effect: >
      Earmarked in principle but not yet delimited. Requires sectoring first,
      then a plan parcial, then urbanisation.
    user_facing: "Long-term development reserve. Highly speculative."

  - code: RURAL_SETTLEMENT
    label_en: Recognised rural settlement
    label_es: Núcleo rural / asentamiento tradicional
    effect: >
      Land outside the urban class where the plan or a regional catalogue
      recognises an existing traditional settlement, and residential building
      linked to it is specifically permitted.
    user_facing: "Rural, but building a home here is specifically allowed."
    why_it_exists: >
      THE HIGHEST-VALUE VALUE IN THIS ENUM. A naive three-bucket model collapses
      these into "countryside, cannot build", which is the opposite of the truth.
      These are the places in rural Spain where you actually can build a house.
      Present in at least six regions under six different names, at three
      different levels of the legal hierarchy (own class in Galicia; category of
      rústico in Cantabria and Extremadura; regional catalogue in Asturias).
    caution: >
      Rights vary enormously between regions and between the traditional and
      common sub-types. Never render a generic "you can build" for this value.
      Always show the regional sub-type and link to the source article.

  - code: RURAL_ORDINARY
    label_en: Rural, ordinary
    label_es: Suelo rústico / no urbanizable de protección ordinaria o común
    effect: >
      Countryside without special protection. Building generally prohibited,
      with a closed list of authorisable uses (agricultural, forestry, some
      tourism, renewables) usually requiring a discretionary regional
      authorisation.
    user_facing: "Countryside. Limited uses, case-by-case permission."

  - code: RURAL_PROTECTED
    label_en: Rural, specially protected
    label_es: Suelo rústico / no urbanizable de especial protección
    effect: >
      Protected by sectoral legislation or by the plan (natural, cultural,
      landscape, coastal, hydrological, risk). Effectively unbuildable.
    user_facing: "Protected countryside. Assume you cannot build."
    note: >
      The specific protection reason belongs on axis 4 (overlays), not here.
      This value records only that special protection applies.

# ---------------------------------------------------------------------------
# REGIONAL MAPPINGS
# ---------------------------------------------------------------------------

regions:

  # === ANDALUCÍA =========================================================
  - region: Andalucía
    ine_ca_code: "01"
    languages: [es]
    law:
      citation: Ley 7/2021, de 1 de diciembre, de impulso para la sostenibilidad del territorio de Andalucía (LISTA)
      boe_url: https://www.boe.es/buscar/doc.php?id=BOE-A-2021-20916
      supersedes: Ley 7/2002 (LOUA)
    class_count: 2
    confidence: needs_review
    verified_at_version: "0.1.1-draft"
    outlier: true
    downgraded_at_version: "0.2.0"
    downgrade_reason: >
      DOWNGRADED FROM `verified`, and the downgrade is the finding. This block
      claimed `verified` at 0.1.1-draft while recording nothing about what was
      read: no verified_against, no verified_on, no verified_note, no article on
      any row. Under the discipline this release establishes — `verified` means
      somebody names the text, the date and the limits — that claim is not
      checkable, and an unfalsifiable claim on a legality-bearing file is worse
      than an honest `needs_review`. Nothing below is asserted to be WRONG;
      Andalucía is simply back in the queue. It is the highest-priority region
      to re-verify, both because of the AFO wedge and because the LISTA/LOUA
      transition means its rows carry two vintages that this block does not
      split.
    notes: >
      LISTA distinguishes only two classes, rústico and urbano, abolishing
      urbanizable as a class and abolishing the consolidado / no consolidado
      categorisation of urban land. The transitional state did not disappear:
      it moved down a level, into actuaciones de nueva urbanización within
      rústico común. First region in Spain to adopt this two-class system.
      MIXED-VINTAGE HAZARD: pre-2021 Andalusian plans still in force use LOUA
      vocabulary (urbanizable, consolidado). Both vocabularies coexist on the
      ground. Always record the plan's approval date alongside the mapping.
    mappings:
      - local: suelo urbano
        canonical: URBAN_CONSOLIDATED
        label_abolished: true
        note: consolidado/no consolidado distinction removed; use actuación type
      - local: suelo rústico con actuación de nueva urbanización
        canonical: DEVELOPABLE_SECTORED
        note: functional equivalent of urbanizable in the other 16 regions
      - local: suelo rústico común
        canonical: RURAL_ORDINARY
      - local: suelo rústico especialmente protegido
        canonical: RURAL_PROTECTED
      - local: núcleo rural tradicional
        canonical: RURAL_SETTLEMENT
      - local: hábitat rural diseminado
        canonical: RURAL_SETTLEMENT
        note: dispersed, not nucleated; rights differ from núcleo tradicional
      # legacy LOUA vocabulary, still live in older plans
      - local: suelo urbanizable (LOUA legacy)
        canonical: DEVELOPABLE_SECTORED
        legacy: true
      - local: suelo no urbanizable (LOUA legacy)
        canonical: RURAL_ORDINARY
        legacy: true

  # === ARAGÓN ============================================================
  - region: Aragón
    ine_ca_code: "02"
    languages: [es]
    law:
      citation: Decreto-Legislativo 1/2014, de 8 de julio, del Gobierno de Aragón, Texto Refundido de la Ley de Urbanismo de Aragón (TRLUA)
      boe_url: https://www.boe.es/buscar/act.php?id=BOA-d-2014-90410
      eli: null
      eli_note: >
        BOE reproduces this disposition under a regional id (BOA-d-2014-90410)
        and publishes no ELI for it. The act.php URL above is what exists;
        it is recorded rather than a fabricated es-ar ELI.
      class_article: art. 11
      in_force_from: 2014-11-20
      supersedes: Ley 3/2009, de 17 de junio, de Urbanismo de Aragón (in force 2009-09-30)
    class_count: 3
    confidence: verified
    verified_at_version: "0.2.0"
    verified_against: https://www.boe.es/buscar/act.php?id=BOA-d-2014-90410
    verified_on: 2026-08-16
    verified_note: >
      Consolidated text read article by article (arts. 11, 13, 15, 16, 17, 18,
      26, 27 and the disposiciones), in HTML and in the consolidated PDF. All
      six local strings that were already here occur verbatim; nothing in this
      region's vocabulary was wrong, which is itself the finding — Aragón was
      the only one of the ten with no leak.

      ENTRY INTO FORCE was read from the primary chain, not from BOE's metadata
      box. The texto refundido has no vigor clause of its own: its last
      provision is DF cuarta (desarrollo reglamentario). The clause is in the
      Decreto-Legislativo's own articulado, which BOE's consolidated HTML omits
      and only the consolidated PDF carries — Disposición final única makes the
      TRLUA enter into force on the same day as "la Ley que modifica la Ley
      4/2009", a forward reference to a law that did not yet exist when the
      decree was signed. That law is Ley 8/2014, de 23 de octubre
      (BOE-A-2014-11993), whose DF cuarta gives twenty days from BOA núm. 214
      de 31/10/2014 → 2014-11-20. The BOA published the TRLUA on 18/07/2014, so
      anyone dating these rows from publication is 125 days early.
      The article citations below are `verified`; the modification history
      behind the consolidation date is not asserted.
    notes: >
      ARAGÓN KEPT `suelo no urbanizable`. It did not follow Extremadura,
      Galicia, the Illes Balears or Andalucía to `rústico`: `suelo rústico`
      occurs 0 times in the whole law. A consumer normalising "no urbanizable"
      to "rústico" across Spain will be wrong precisely here, and silently.
      `núcleo rural` 0×, `protección ordinaria` 0× — no settlement class, and
      the absence is real rather than unresearched.

      Art. 11.1 puts all three classes and all six categories in one sentence:
      "a) Suelo urbano, consolidado o no consolidado. b) Suelo urbanizable,
      delimitado o no delimitado. c) Suelo no urbanizable, especial o
      genérico." Art. 11.2/11.3 make SNU residual, and art. 17.2 says it again
      for the category ("la clase y categoría residual"), so RURAL_ORDINARY is
      the default in Aragón and the law states it twice.

      ART. 18 IS THE SHARPEST ORDINARIO/ESPECIAL RULE IN SPAIN AND IT IS ONLY
      HALF RÉGLADO. Land under art. 16.1.a) (sectoral, dominio público,
      ambiental, patrimonio, or territorial planning) and 16.1.b) (riesgos —
      "peligrosidad para la seguridad de las personas y los bienes") is
      especial "en todo caso", with no plan discretion. Land under 16.1.c)
      (ecological, agricultural, livestock, forestry, landscape values) is
      especial ONLY where the plan general recognises it, and only where those
      values "se hayan puesto de manifiesto en un instrumento de planificación
      ambiental, territorial o cultural". Read that carefully before treating
      it as permission to classify from a protection layer: the trigger is the
      PLAN's recognition, with the sectoral instrument as its evidentiary
      precondition. The layer is necessary and never sufficient, and 16.1.c
      land whose values the plan has not yet recognised stays genérico.
      Art. 18 is the best statutory illustration of why the overlay rule in
      OQ-5 is worded the way it is.

      Aragón has a statutory cédula urbanística (art. 27) and a statutory
      consulta for promoting urbanizable no delimitado (art. 26). The cédula is
      the artefact an implementation should point users to when it refuses to
      answer.

      ARTICLE CORRECTION carried out here: earlier drafts cited "arts. 34–36 /
      art. 37" for the rural split. Those are the autorización and régimen
      articles. The CLASSIFYING articles are arts. 11, 13, 15, 16, 17 and 18.
    mappings:
      - local: suelo urbano consolidado
        canonical: URBAN_CONSOLIDATED
        article: arts. 11.1.a), 13.3
        note: >
          Art. 13.3 makes consolidado the residual category of urban land, and
          art. 13.1 makes the split optional ("podrá distinguir").
      - local: suelo urbano no consolidado
        canonical: URBAN_UNCONSOLIDATED
        article: arts. 11.1.a), 13.2
        note: >
          GESTIÓN-DEFINED, not services-defined: art. 13.2 identifies SUNC as
          the land carrying actuaciones urbanísticas integradas (art. 118).
          Contrast Canarias art. 47, where the same label is servicing-defined.
      - local: suelo urbanizable delimitado
        canonical: DEVELOPABLE_SECTORED
        article: arts. 11.1.b), 15.3
        note: >
          "Los sectores de urbanización prioritaria previstos por el plan
          general". Aragón is the region that did NOT abolish the
          delimitado/no delimitado pair — compare Galicia, Cantabria and
          Canarias, which each suppressed it differently. Nothing about the
          word `delimitado` can be normalised across Spain.
      - local: suelo urbanizable no delimitado
        canonical: DEVELOPABLE_UNSECTORED
        article: arts. 11.1.b), 15.3, 26
      - local: suelo no urbanizable genérico
        canonical: RURAL_ORDINARY
        article: arts. 11.1.c), 17
        note: >
          Art. 17.2: "será la clase y categoría residual". In municipalities
          with no plan general, art. 11.3 puts everything not urbano here.
      - local: suelo no urbanizable especial
        canonical: RURAL_PROTECTED
        article: arts. 11.1.c), 16, 18
        protection_basis: [sectoral, risk, environmental]
        note: >
          Three grounds, two of them reglados. `sectoral` = art. 16.1.a)
          (sectoral legislation, dominio público, ambiental, patrimonio,
          territorial planning) and `risk` = art. 16.1.b), both especial "en
          todo caso". `environmental` = art. 16.1.c) (ecological, agrarian,
          forestry, landscape values), especial only where the plan general
          recognises it AND the values appear in an ambiental, territorial or
          cultural instrument. A parcel matching 16.1.c whose plan has not
          recognised it is genérico, not especial.

  # === ASTURIAS ==========================================================
  - region: Principado de Asturias
    ine_ca_code: "03"
    languages: [es, ast]
    law:
      citation: Decreto Legislativo 1/2004, Texto Refundido en materia de Ordenación del Territorio y Urbanismo (TROTU)
      boe_url: https://www.boe.es/buscar/act.php?id=BOE-A-2004-10070
      class_article: art. 112
      regulation: Decreto 63/2022, Reglamento de Ordenación del Territorio y Urbanismo (ROTU)
      eli: https://www.boe.es/eli/es-as/dlg/2004/04/22/1/con
      in_force_from: 2004-04-28
      supersedes: Ley del Principado de Asturias 3/2002, de 19 de abril
    class_count: 3
    confidence: verified
    verified_at_version: "0.2.0"
    verified_against: https://www.boe.es/eli/es-as/dlg/2004/04/22/1/con
    verified_on: 2026-08-16
    verified_note: >
      Consolidated text read article by article (arts. 40, 41, 112, 113, 115,
      116, 122, 131, 136, 137 and DT primera), in HTML and in the consolidated
      PDF. ENTRY INTO FORCE read from the primary chain: the texto refundido's
      last provision is DF segunda (desarrollo reglamentario) and carries no
      vigor clause; the clause is in the Decreto legislativo's own articulado,
      which BOE's consolidated HTML drops and only the PDF carries —
      Disposición final única, "entrarán en vigor el día siguiente al de su
      publicación en el Boletín Oficial del Principado de Asturias", BOPA núm.
      97 de 27/04/2004 → 2004-04-28. That matches BOE's metadata box, but the
      box is informativo and is not the authority; this chain is.

      GENERALISABLE: for ANY texto refundido approved by decreto legislativo,
      the entry-into-force clause lives in the approving decree and BOE's
      consolidated HTML shows only the refundido. Confirmed for Aragón (four
      months' difference), Asturias (one day) and the Comunitat Valenciana.
      Checked and found NOT to apply to the Illes Balears and Murcia, whose
      instruments are leyes.

      The Catálogo de Núcleos Rurales' actual approval status and coverage were
      NOT established and are not asserted anywhere below — see the note.
    notes: >
      STRUCTURALLY THE STRANGEST REGION IN SPAIN: ASTURIAS HAS NO ORDINARY
      RURAL CATEGORY AT ALL. Art. 122 lists five categories of suelo no
      urbanizable — especial protección, de interés, de costas, de
      infraestructuras, and núcleo rural — and there is no común, no genérico
      and no ordinaria among them. Art. 115.2 says the same from the other
      side, defining núcleo rural as "suelo no urbanizable de ocupación
      residencial", a category rather than a class. RURAL_ORDINARY is therefore
      UNMAPPED in Asturias. That is a finding, not an omission, and no row was
      invented to fill the slot: doing so would answer "what may I do here"
      with a permission the categories do not grant.

      Asturias, like Aragón, kept `no urbanizable`; `suelo rústico` occurs 0×.
      Art. 112 confirmed verbatim: plans classify concejo land as "suelo
      urbano, urbanizable y no urbanizable".

      URBANIZABLE IS THE RESIDUAL CLASS HERE (art. 116.1: everything the PGO
      classifies as neither urbano nor no urbanizable) — the inverse of every
      other region in this file, where rural land is residual. The axis is
      PRIORITY (art. 116.2 + art. 62, sectores de urbanización prioritaria),
      not sectorisation: `sectorizado` and `delimitado` are not class terms in
      Asturias, and DEVELOPABLE_* is reached by exclusion.

      NÚCLEO RURAL — the class assignment is the municipal plan's (art. 136.1,
      "los asentamientos consolidados de población en suelo no urbanizable que
      el planeamiento municipal configure con tal carácter"; art. 137.1 makes
      the PGO set the requirements, which are then acquired "mediante la mera
      concurrencia de dichos requisitos"). The Catálogo de Núcleos Rurales is
      arts. 40–41, NOT art. 136: art. 41 makes it "vinculante para el
      planeamiento urbanístico municipal, que no podrá alterar la clasificación
      ni calificación urbanística de los núcleos incluidos en el mismo". So the
      Catálogo overrides the plan for the cores it lists, and the plan governs
      the rest.
      Art. 136.3 is worth carrying verbatim into any answer: acquiring rodado
      access, water, sewerage, electricity or telephony does NOT convert a
      núcleo rural into suelo urbano and does not oblige the ayuntamiento to
      amend the PGO. Art. 113.a) says it from the urban side — predios in
      núcleos rurales are not suelo urbano even with the services, and land
      outside a malla urbana is not urbano either.
      OPEN RECONNAISSANCE (do not assert either way): whether the Catálogo has
      in fact been approved, and with what coverage, is not established. DT
      primera.3.d) legislates at length for the period "en tanto no se apruebe
      … el Catálogo", which is a hint and not evidence. Until measured, this
      file describes the Catálogo's statutory binding force and does NOT
      promise it as an ingestible layer.
    mappings:
      - local: suelo urbano consolidado
        canonical: URBAN_CONSOLIDATED
        article: art. 114
      - local: suelo urbano no consolidado
        canonical: URBAN_UNCONSOLIDATED
        article: art. 114
      - local: suelo urbanizable prioritario
        canonical: DEVELOPABLE_SECTORED
        article: arts. 116.2, 62
      - local: suelo urbanizable no prioritario
        canonical: DEVELOPABLE_UNSECTORED
        article: art. 116
        note: >
          Asturias' urbanizable axis is priority, not sectorisation, and
          urbanizable is the RESIDUAL class (art. 116.1). The canonical pair is
          the closest available fit, not a translation of the same distinction.
      - local: núcleo rural
        canonical: RURAL_SETTLEMENT
        settlement_position: within_rural
        article: arts. 122.e), 136, 137
        source: >
          Municipal plan (arts. 136.1, 137.1), overridden for catalogued cores
          by the Catálogo de Núcleos Rurales del Principado (arts. 40–41).
        previous_local: núcleo rural (Catálogo del Principado)
        note: >
          Art. 122.e) makes it "una categoría de suelo no urbanizable objeto de
          ocupación residencial" — inside rural land, not a class of its own
          (contrast Galicia) and not inside urban land (contrast Murcia and
          Cantabria after 2024). The previous local string named the Catálogo
          as if it were the source of the category; it is the source of the
          OVERRIDE for the cores it lists, which is a narrower claim.
      - local: suelo no urbanizable de especial protección
        canonical: RURAL_PROTECTED
        article: art. 122.a)
        protection_basis: environmental
      - local: suelo no urbanizable de interés
        canonical: RURAL_PROTECTED
        article: art. 122.b)
        valid_from: 2004-04-28
        protection_basis: [interest, risk, environmental]
        note: >
          THE SUCCESSOR ROW to `suelo no urbanizable genérico` below: unadapted
          genérico land is governed as de interés by DT primera.3.c). valid_from
          is TROTU's entry into force.
          A genuinely mixed basis, and the clearest case for allowing a LIST:
          art. 122.b) bundles riesgos naturales, singularidades agrícolas,
          forestales and ganaderas, AND "la preservación del peculiar sistema
          de poblamiento del territorio asturiano". Its second paragraph puts
          the ring of land around a núcleo rural in this category even where it
          carries no agricultural use. Asturias is one of eight regions in this
          file and one of eight different placements of risk land.
      - local: suelo no urbanizable de costas
        canonical: RURAL_PROTECTED
        article: arts. 122.c), 133–135
        protection_basis: coastal
      - local: suelo no urbanizable de infraestructuras
        canonical: RURAL_PROTECTED
        article: art. 122.d)
        protection_basis: infrastructure
      # Ley 3/2002 vintage. Kept because unadapted plans still carry the term.
      - local: suelo no urbanizable genérico
        canonical: RURAL_PROTECTED
        article: DT primera.3
        legacy: true
        valid_to: 2004-04-27
        valid_from: 2002-01-01
        previous_local: suelo no urbanizable (genérico)
        protection_basis: [interest, risk, environmental]
        note: >
          CORRECTED, and it was wrong twice. The term is pre-TROTU vocabulary —
          all three occurrences in the current law are in DT primera.3,
          describing Ley 3/2002-era plans — and its consequence is the opposite
          of what the previous row said. DT primera.3 gave plans one year from
          2004-04-28 to re-sort genérico land into the art. 122 categories, and
          then: "Si vence el plazo previsto para la adaptación del planeamiento,
          el suelo no urbanizable genérico quedará sometido al régimen previsto
          en este Texto Refundido para el suelo no urbanizable DE INTERÉS",
          with arts. 127 ss. of the Normas Urbanísticas Regionales en el Medio
          Rural of 29/12/1983 as the fallback where the plan regulates nothing.
          So the string maps to RURAL_PROTECTED, not RURAL_ORDINARY: the
          previous row under-stated the restriction on exactly the land where
          somebody wants to build. valid_to is the day before TROTU entered
          into force; the régimen consequence above runs on past it, which is
          why the row is kept rather than deleted.

  # === ILLES BALEARS =====================================================
  - region: Illes Balears
    ine_ca_code: "04"
    languages: [ca, es]
    law:
      citation: Llei 12/2017, de 29 de desembre, d'urbanisme de les Illes Balears (LUIB)
      boe_url: https://www.boe.es/eli/es-ib/l/2017/12/29/12/con
      eli: https://www.boe.es/eli/es-ib/l/2017/12/29/12/con
      class_article: arts. 18–21
      in_force_from: 2018-01-01
      also:
        - citation: Ley 6/1997, de 8 de julio, del suelo rústico de las Illes Balears (LSRIB)
          eli: https://www.boe.es/eli/es-ib/l/1997/07/08/6/con
          in_force_from: 1997-07-16
          holds: the definitions of rústico protegido and rústico común (arts. 4, 6, 7)
        - citation: Ley 1/1991, de 30 de enero, de espacios naturales y de régimen urbanístico de las áreas de especial protección de las Illes Balears
          in_force_from: 1991-03-10
          holds: >
            declares ANEI and ARIP by name with graphic annexes and classifies
            them as especial protección by operation of law (arts. 2–4, 7, 8)
    class_count: 3
    confidence: verified
    verified_at_version: "0.2.0"
    verified_against: https://www.boe.es/eli/es-ib/l/2017/12/29/12/con
    verified_on: 2026-08-16
    verified_note: >
      Three statutes read, none of which repeals the others: the LUIB and the
      LSRIB in BOE consolidated text (both "última actualización 13/06/2026"),
      Ley 1/1991 in its consolidated PDF (29/12/2022), and the AUTHENTIC
      CATALAN text of the LUIB in BOIB núm. 160 de 29/12/2017, fascicle 214,
      pp. 42610–42720. BOE publishes the LUIB in Castilian translation —
      `nucli rural` occurs 0× in BOE's text — so every Catalan string below is
      read from the BOIB, not translated.

      Article-level modification history was checked against BOE's change
      apparatus: arts. 18, 19, 21, 25 and 26.1 carry NO modification notes
      since 2018-01-01. Only art. 20 (flood bar added 2024) and art. 26.2
      (suppressed 2018) moved.

      ENTRY INTO FORCE from the disposiciones finales directly, and the DL trap
      was checked and does not apply — both instruments are leyes, so the vigor
      clauses are in the consolidated HTML where they belong. LUIB DF tercera:
      "La presente ley entrará en vigor el 1 de enero de 2018", a fixed
      calendar date rather than arithmetic off the BOIB date. LSRIB DF segunda:
      day after BOCAIB núm. 88 de 15/07/1997 → 1997-07-16.

      NOT READ: the LSRIB's Catalan original (BOCAIB núm. 88 de 15/07/1997).
      Its two terms, `sòl rústic protegit` and `sòl rústic comú`, are confirmed
      verbatim in the LUIB's own Catalan art. 21, so the vocabulary is sourced
      without it — but no claim is made here about the 1997 gazette's wording.

      RESOLVED SINCE THE FIRST DRAFT OF THIS NOTE: the vigor date of
      Decreto-ley 2/2012, which opens the núcleo rural gap below, is
      2012-02-19. It came from the owner's own LSRIB reading rather than from
      bytes archived here, and the row says so. LSRIB arts. 6 and 7 were read in
      operative text in the same pass, confirming that art. 6's protection
      grounds expressly always include the Ley 1/1991 areas, the ENP declared
      under Ley 4/1989, and lands designated by territorial instruments
      (Ley 8/1987, now the DOT of Ley 6/1999) — which is the statutory basis for
      the two ANEI/ARIP rows below, and the reason they are rows rather than a
      note.
    notes: >
      THE ONLY REGION IN THIS FILE WHOSE AXIS-1 ANSWER IS SPREAD ACROSS THREE
      STATUTES. The LUIB gives the classes, the LSRIB (1997, still in force,
      gutted to a stub) gives the definitions of protegit and comú, and Ley
      1/1991 classifies specific named areas by operation of law. A row citing
      only the LUIB cites a third of the law.

      Art. 18: the plan general classifies the whole municipal territory as
      urbà, urbanitzable and rústic. Art. 21 is both the residual clause and
      the split — "També constitueixen sòl rústic els terrenys no classificats
      expressament com a urbans o urbanitzables", then "Segons la intensitat de
      la protecció, el planejament ha de diferenciar en aquesta classe de sòl
      les QUALIFICACIONS BÀSIQUES de sòl rústic protegit i sòl rústic comú."
      Note the word: protegit/comú are qualificacions, not categories or
      subclasses. Balears is the only region in this file that puts the
      ordinario/protegido distinction on the qualification axis rather than the
      classification axis. The canonical mapping still holds; the rows say what
      it is so that an implementation looks in the right field.

      RISK IS A CLASSIFICATION DRIVER HERE, NOT A PROTECTION BASIS — the eighth
      distinct placement in this file. LSRIB art. 4.2.c) pushes land whose
      "características geotécnicas o morfológicas no aconsejen el desarrollo
      urbanístico por el riesgo" into the CLASS rústico without saying protegit
      or comú, and LUIB art. 20.2.b) separately bars new residential, tourist
      and mixed urbanizable sectors in zonas de flujo preferente and zonas
      inundables. Art. 20.2.b) is not original: art. 20 was modified by art.
      54.1 of Ley 7/2024, de 11 de diciembre (BOIB núm. 162 de 13/12/2024), in
      force 2024-12-14. Before that day the flood bar did not exist in the LUIB.

      THE ISLAND COLUMN IS STRONGER THAN AN AXIS-4 OVERLAY. Art. 15.1: "El
      ejercicio de las competencias urbanísticas … corresponderá a LAS ISLAS Y
      A LOS MUNICIPIOS" — the autonomous community is not in the chain; art.
      15.2 gives the consejos insulares their own potestad reglamentaria and
      art. 15.4 leaves the Govern the suprainsular residue only (`consejo
      insular` 78× in the law). It reaches axis 1 directly: art. 26.1 has the
      municipal plan delimit núcleos rurales "quan no estigui establerta pels
      INSTRUMENTS D'ORDENACIÓ TERRITORIAL" — the PTI may delimit them itself,
      exactly as the Asturian Catálogo does. An ingest reading only municipal
      plans will miss whichever islands delimited theirs in the PTI.

      FORMENTERA IS NOT A FOOTNOTE. DA sexta: the island's PTI "pasa a
      denominarse Plan Territorial Insular de Formentera" and is "el
      instrumento integral", carrying the determinations of the plan general
      and of the planes de ordenación detallada as well as the territorial
      ones; the Consell Insular de Formentera holds both the ayuntamiento's and
      the consell's competences; asentamientos en medio rural already in that
      PTI keep the PTI's régimen; and the PTI's régimen for existing buildings
      in suelo rústico prevails over all other normativa. Formentera is one
      municipality whose axis-1 source document is a territorial plan, and it
      cannot be ingested with the same reader as the other 8,131.

      UNMAPPED HERE, both deliberately: URBAN_UNCONSOLIDATED (the LUIB has no
      consolidado/no consolidado categories at all) and DEVELOPABLE_UNSECTORED
      (every urbanizable is a sector). See the rows for what the law has
      instead.

      NOT AXIS 1, BUT IT BELONGS IN THIS FILE'S NOTES BECAUSE IT WILL BE
      MISTAKEN FOR AXIS 1: LSRIB DA octava, as amended 2024–2026, puts the
      FLOOD OVERLAY'S BUILDING CONSEQUENCES INSIDE THE RÚSTICO LAW — rules for
      new isolated dwellings in SRP-APR areas and zonas de flujo preferente,
      keyed to RDPH arts. 9 bis and 14 bis. The Illes Balears is the only
      region of the eleven that codifies the flood layer's effects in its land
      law rather than leaving them to sectoral water legislation. It still does
      not make flood exposure a land class: an SRP-APR parcel's class is
      whatever arts. 18/21 make it. Cite DA octava in the hazard layer for
      Balearic parcels, alongside SNCZI, and nowhere on this axis.
    mappings:
      - local: sòl urbà
        local_es: suelo urbano
        canonical: URBAN_CONSOLIDATED
        article: arts. 19, 25, 29
        previous_local: sòl urbà no consolidat
        note: >
          CORRECTED: this row now absorbs all urban land, and the separate
          `sòl urbà no consolidat` row was removed as invented. That string
          occurs 0× in the authentic Catalan text and `urbano no consolidado`
          0× in BOE's Castilian; the single occurrence of `urbano consolidado`
          is art. 42.1.c) on population capacity, not a class. What the LUIB
          has instead is (i) the SOLAR condition, art. 25, and (ii) a deberes
          split in art. 29 — 29.2 simple compleción de la urbanización versus
          29.3 actuaciones de transformación urbanística. The only appearance
          of "suelo urbano sin urbanización consolidada" is DT decimoprimera, a
          transitional label for pre-2018 urban land lacking the art. 22 basic
          services. URBAN_UNCONSOLIDATED is unmapped in the Illes Balears; an
          implementation needing the duty should read it off art. 29.3.
      - local: sòl urbanitzable
        local_es: suelo urbanizable
        canonical: DEVELOPABLE_SECTORED
        article: arts. 20, 42.2.c), 89
        note: >
          Under-specified rather than wrong. `urbanitzable delimitat`,
          `sectoritzat` and `no delimitat` all occur 0×: art. 20 knows only
          "sectores de suelo urbanizable", so every urbanizable is a sector and
          DEVELOPABLE_UNSECTORED is unmapped. The one distinction the LUIB
          draws is procedural — art. 42.2.c) "suelos urbanizables DIRECTAMENTE
          ORDENADOS" (the plan de ordenación detallada has already ordered the
          sector, so no plan parcial is needed) versus art. 89 "suelo
          urbanizable NO ORDENADO DIRECTAMENTE". That is an ordenación axis,
          not a sectorisation axis, and it is not mapped to the canonical pair.
      - local: nucli rural tradicional
        local_es: núcleo rural tradicional
        canonical: RURAL_SETTLEMENT
        settlement_position: within_rural
        article: arts. 26.1.a), 33
        valid_from: 2018-01-01
        note: >
          Art. 26: "Dins la classificació de sòl rústic, s'estableixen com una
          CATEGORIA ESPECIAL els nuclis rurals", delimited by a perimeter line
          around the existing buildings "sense que en cap cas no es permeti un
          creixement perifèric futur". Tradicional means implanted before the
          Ley de 12 de mayo de 1956, proved by "referencias documentales,
          gráficas, fotográficas, legales o literarias"; ordenación detallada by
          plan especial aimed at compleción; edificabilidad no greater than the
          existing mean and height no greater than planta baja + 1.
          DECISIVE FOR settlement_position, art. 26.1 closing line: "Las
          revisiones o modificaciones de los planes NO PODRÁN ATRIBUIR EN NINGÚN
          CASO A ESTOS NÚCLEOS LA CLASIFICACIÓN DE SUELO URBANO." The exact
          mirror of Murcia, where the same figure sits inside urban land.
          Art. 33.2: without a plan de ordenación detallada or a special plan,
          NO new building, extension or service installation may be authorised.
          A delimited núcleo rural with no special plan is a frozen núcleo, and
          the delimitation must not be read as buildability.
      - local: nucli rural ordinari
        local_es: núcleo rural ordinario
        canonical: RURAL_SETTLEMENT
        settlement_position: within_rural
        article: arts. 26.1.b), 33
        valid_from: 2018-01-01
        note: >
          Those already recognised and delimited in the territorial or general
          planning instruments in force before 2018-01-01, governed by those
          instruments, with edificabilidad and height capped at the existing
          means. So the answer for an ordinari núcleo is read from the PTI or
          the plan that delimited it, not from the LUIB.
      # LSRIB vintage. A 2012–2017 Balearic plan cannot carry the category at all.
      - local: nucli rural
        local_es: núcleo rural
        canonical: RURAL_SETTLEMENT
        settlement_position: within_rural
        article: LSRIB art. 8
        legacy: true
        valid_from: 1997-07-16
        valid_to: 2012-02-18
        note: >
          FOUR VINTAGE BOUNDARIES, NOT THREE, AND THERE IS A REAL GAP IN THE
          MIDDLE. LSRIB art. 8 "Núcleos rurales" was in force from 1997-07-16
          (art. 8.3 modified by art. 21.1 of Ley 9/1997, de 22 de diciembre).
          It was derogated by the disposición derogatoria of Decreto-ley 2/2012,
          de 17 de febrero, in force 2012-02-19, and again by that of Ley 7/2012,
          de 13 de junio (BOIB núm. 91 de 23/06/2012, in force 2012-06-24) —
          Balearic law derogated the same article twice, four months apart.
          valid_to is the day before the FIRST derogation took effect, which is
          the honest close: the figure stopped existing on 2012-02-19, and the
          June repeat is belt-and-braces on an article that was already gone.
          The 2012-02-19 date was supplied by the owner's Baleares reading and
          resolves what this row previously recorded as an open question; the
          Decreto-ley itself is a BOIB-only reference that this project has
          still not fetched, so the date is owner-verified rather than
          bytes-verified here.
          FROM THEN UNTIL 2018-01-01 THERE WAS NO NÚCLEO RURAL FIGURE IN
          BALEARIC LAW. The LUIB preamble says so in terms: "se introduce … el
          correspondiente al suelo rústico, donde SE VUELVE A INTRODUCIR el
          término de los núcleos rurales." A plan drafted in that window cannot
          carry the category, and a match on this string from such a plan is
          evidence of something else.
          A FOURTH BOUNDARY sits inside the current period: art. 26.2 was
          SUPRIMIDO by art. 5.1 of Ley 6/2018, de 22 de junio (BOIB núm. 78 de
          26/06/2018, in force 2018-06-27). The suppressed paragraph was the
          harshest one — ordenación by plan especial aimed at "la CONGELACIÓN
          del asentamiento … Queda excluida la posibilidad de nuevas
          edificaciones y ampliación de las existentes". For 177 days, from
          2018-01-01 to 2018-06-26, a Balearic núcleo rural was a frozen núcleo
          by statute. Licence and plan decisions inside that window were taken
          under a different rule; the class did not change, so no separate rows
          are split for it, but an answer about that window must say so.
      - local: sòl no urbanitzable
        local_es: suelo no urbanizable
        canonical: RURAL_ORDINARY
        article: LSRIB DT primera
        legacy: true
        flag: resolve_by_plan_qualification
        note: >
          THE VINTAGE BRIDGE FOR PRE-1997 BALEARIC PLANS, and it is a crosswalk
          rule written by the legislator — the same shape as Murcia's DT quinta.
          LSRIB DT primera makes suelo no urbanitzable under an unadapted plan
          equivalent to sòl rústic, and then splits it by the PLAN'S OWN
          calificación: where the calificación carries a specific protection
          régimen the land is sòl rústic PROTEGIT, otherwise sòl rústic COMÚ.
          The canonical above is the default branch. The protected branch is
          not a separate row because it depends on a fact about the individual
          plan rather than on the string; where the calificación is unknown the
          answer is confidence='none' and a pointer to the cédula urbanística,
          not a guess in either direction.
      - local: sòl rústic comú
        local_es: suelo rústico común
        canonical: RURAL_ORDINARY
        article: LUIB art. 21; LSRIB art. 7
        note: >
          LSRIB art. 7 defines it purely residually — "el resto de los terrenos
          asignados a esta clase de suelo" — with an internal duty to single out
          masas forestales y de monte bajo. A qualification, not a category.
      - local: sòl rústic protegit
        local_es: suelo rústico protegido
        canonical: RURAL_PROTECTED
        article: LUIB art. 21; LSRIB arts. 4.2, 6
        protection_basis: [environmental, interest, coastal, sectoral]
        previous_local: sòl rústic protegit (ANEI, ARIP, AAPI)
        note: >
          LSRIB art. 6: "por sus valores excepcionales, la función territorial o
          la defensa de la fauna, flora y el equilibrio ecológico … un régimen
          especial de protección distinto del general". LSRIB art. 4.2 lists
          what goes in rústico "en todo caso": dominio público
          marítimo-terrestre e hidráulico, relevant agrarian, forest, natural,
          landscape and cultural value, geotechnical or morphological RISK,
          unidades paisajísticas, ethnological value and heritage surroundings,
          and exclusion by the estrategia territorial.
          `risk` is deliberately NOT among the protection_basis values here:
          art. 4.2.c) puts risk land in the CLASS without saying protegit or
          comú, so claiming it as a basis for this qualification would assert
          something the statute does not.
          PREVIOUS STRING CORRECTED: the acronyms were removed because they do
          not belong on this row — see the two ANEI/ARIP rows below, and note
          that AAPI was wrong twice over.
      - local: àrea natural d'especial interès (ANEI)
        local_es: área natural de especial interés (ANEI)
        canonical: RURAL_PROTECTED
        article: Ley 1/1991 arts. 2.2, 3, 7, 8
        protection_basis: [environmental, interest]
        note: >
          On axis 1 rather than axis 4 because Ley 1/1991 art. 7 classifies land
          in an ANEI as "No Urbanizable de Especial Protección" BY OPERATION OF
          LAW, and art. 8 obliges every territorial and urbanistic instrument to
          respect it. Art. 3 declares the ANEIs BY NAME, per island, with
          graphic annexes — a closed statutory list, not a plan decision. Art.
          3.3 excludes land already urban at 1991-03-10.
          This is genuinely different from a sectoral overlay, and the
          difference is the reason the row exists. It is still not licence to
          read a class off a protection layer generally: the special feature
          here is a named statutory list that classifies, not a layer that
          evidences grounds for classifying.
      - local: àrea rural d'interès paisatgístic (ARIP)
        local_es: área rural de interés paisajístico (ARIP)
        canonical: RURAL_PROTECTED
        article: Ley 1/1991 arts. 2.3, 4, 7, 8
        protection_basis: [environmental, interest]
        note: >
          Same operation-of-law classification as the ANEI (art. 7). Art. 4
          expressly EXCLUDES from ARIP any land constituted as an Área de
          Asentamiento en Paisaje de Interés.
          WHY "AAPI" IS GONE FROM THIS FILE, because the error was material and
          not cosmetic: Ley 1/1991 uses no acronyms at all (ANEI, ARIP and AAPI
          each occur 0× in it — the LUIB later picks up ANEI 2× and ARIP 3×,
          and AAPI appears in NONE of the three statutes). Worse, Área de
          Asentamiento en Paisaje de Interés is URBAN and URBANIZABLE land, not
          protected rural: art. 2.4 defines it as "espacios destinados a usos y
          actividades de naturaleza urbana que supongan una transformación
          intensa", and art. 5 constitutes it out of land already classified
          urbano at entry into force, the urbanizables programados listed in
          anexo II, and land later classified urbanizable, inside the Serra de
          Tramuntana or els Amunts d'Eivissa. A parcel in an AAPI answered as
          `sòl rústic protegit` was answered backwards.

  # === CANARIAS ==========================================================
  - region: Canarias
    ine_ca_code: "05"
    languages: [es]
    law:
      citation: Ley 4/2017, de 13 de julio, del Suelo y de los Espacios Naturales Protegidos de Canarias (LSENPC)
      eli: https://www.boe.es/eli/es-cn/l/2017/07/13/4/con
      class_article: art. 30.1
      in_force_from: 2017-09-01
      supersedes: Decreto Legislativo 1/2000, Texto Refundido de las Leyes de Ordenación del Territorio y de Espacios Naturales de Canarias
    class_count: 3
    confidence: verified
    verified_at_version: "0.2.0"
    verified_against: https://www.boe.es/eli/es-cn/l/2017/07/13/4/con (BOE-A-2017-10295, consolidado)
    verified_on: 2026-08-16
    verified_note: >
      Articles read: 23, 30, 33, 34 (the full taxonomy, letter by letter), 35,
      40, 47, DT primera and the disposición final on entry into force, plus the
      preamble passages that abolish the sectorizado/no sectorizado
      distinction. Canarias legislates in Castilian, so the consolidated text is
      in the language the law binds in and no regional-gazette fetch was needed.
      TWO CLASS-LEVEL DEFECTS were found here, both in rows this file had
      carried since 0.1.1-draft, and one of them is the most dangerous single
      row found across the eleven regions. Both are documented on the rows
      themselves rather than only here, because a consumer reads rows.
      ARTICLE CORRECTION: the brief cited arts. 64–71 for the rústico taxonomy.
      Those are the RÉGIMEN articles (usos admisibles, protección agraria,
      protección minera and so on). The CLASSIFYING article is art. 34, "Suelo
      rústico: categorías y subcategorías".
      Entry into force is a fixed calendar date, not a vacatio computation: "La
      presente ley entrará en vigor el día 1 de septiembre de 2017." Note that
      BOE published it on 08/09/2017, AFTER it was already in force; the
      operative publication is «BOC» núm. 138 de 19/07/2017. Anyone deriving
      the date from the BOE header gets it wrong by a week.
    notes: >
      CRS HAZARD: Canary geometry is WGS84, not ETRS89 like the rest of Spain.
      Reproject on ingest or the islands land in the Atlantic.
      Protected natural spaces are unusually dominant here — axis 4 matters more
      in Canarias than anywhere else.

      RICHEST RÚSTICO VOCABULARY IN SPAIN, and the only region that puts the
      ACRONYMS in the statute itself. SRPN, SRPAG, SRCR and the rest are not
      shorthand invented by this crosswalk; they are the strings a Canarian plan
      actually carries, which is why every rústico row below has a local_code.
      Match on the code first and the phrase second.

      art. 30.1 gives three classes; art. 30.2 makes rústico residual and
      assigns classification expressly to the plan general; art. 30.3 makes the
      plan adscribe each parcel to a categoría/subcategoría "de acuerdo con los
      criterios establecidos por la presente ley". So the NAMES are statutory
      and the ASSIGNMENT is plan-resolved — the same split as Extremadura.
      art. 33 defines rústico, with 33.1.e) riesgos, 33.4 costas and 33.6 the
      residual rule.

      THREE OF THE SUBCATEGORIES ARE OVERLAYS, NOT EXCLUSIVE CATEGORIES.
      arts. 34.a.4 (SRPEN), 34.a.5 (SRPCO) and 34.d (SRPI) each say in terms
      that they are "compatible con cualquier otra" and only add restrictions.
      A parcel can therefore be SRPAG and SRPI at once, and any consumer that
      treats the rústico subcategory as single-valued will mis-answer. Rows
      carry `overlay: true`.

      PROTECTED DOES NOT MEAN ENVIRONMENTAL, and Canarias is the cleanest proof
      of it in Spain: art. 34.b) is protección ECONÓMICA, and SRPM — protección
      minera — is protected so that it CAN be mined. Compare Comunitat
      Valenciana, where the equivalent extractive land is ZRC-EX, a category of
      COMMON rural land. Two regions, the same physical fact, opposite sides of
      the ordinario/protegido line. Nothing about protection status may be
      inferred from land use.

      `núcleo rural` occurs ZERO times — no leak from Galician or Cantabrian
      vocabulary here.

      art. 35 gives asentamientos a hard statutory test, unusual in Spain: at
      least ten dwellings forming calles, plazas or caminos, OR fewer with more
      than forty residents; buildings within 200 m of the perimeter join it,
      excluding agro/industrial/sports/cemetery land and bridged barrancos.
      art. 35.7 then puts an asentamiento rural with art. 46.1.a) services into
      the state-law *situación de suelo urbanizado* — so state situation and
      regional class diverge here by design, and an answer that quotes one must
      not be read as the other.

      art. 23, Registro del planeamiento de Canarias, is the statutory hook for
      exactly what this engine does: 23.3 obliges the autonomous administration
      to publish and keep current a unitary database of every instrument in
      force, remitted simultaneously with the diario-oficial publication, and
      23.5 obliges incorporation of REFERENCIAS CATASTRALES per parcel where
      technically and economically possible. Canarias should therefore carry a
      regional_planning_registries row with art. 23 as its basis.
    removed_mappings:
      - local: suelo rústico de protección (ambiental, económica, de infraestructuras)
        canonical_was: RURAL_PROTECTED
        removed_at_version: "0.2.0"
        reason: >
          Not a term any Canarian plan carries — three statutory categories
          collapsed into one parenthesis, omitting asentamiento's sibling status
          entirely and losing all ten subcategories and their acronyms. Replaced
          by the art. 34 rows below.
    mappings:
      - local: suelo urbano consolidado
        local_code: SUCO
        canonical: URBAN_CONSOLIDATED
        article: art. 47
      - local: suelo urbano no consolidado
        local_code: SUNCO
        canonical: URBAN_UNCONSOLIDATED
        article: art. 47
        note: >
          art. 47.3: consolidated land in actuaciones de dotación counts as
          SUNCO *a efectos de gestión* only. That is a gestión status, not a
          reclassification, and must not move the row.
      - local: suelo urbanizable ordenado
        local_code: SUOR
        canonical: DEVELOPABLE_SECTORED
        article: art. 40
        valid_from: 2017-09-01
        note: >
          THE MAPPING IS AN APPROXIMATION AND THE FILE SHOULD SAY SO. Canarias'
          axis is ordenación pormenorizada — whether the land has detailed
          planning — not sectorisation. Preamble: "La única distinción relevante
          será si ese suelo urbanizable cuenta o no con ordenación
          pormenorizada." DEVELOPABLE_SECTORED is the nearest canonical value,
          not a synonym.
      - local: suelo urbanizable no ordenado
        local_code: SUNOR
        canonical: DEVELOPABLE_UNSECTORED
        article: art. 40
        valid_from: 2017-09-01
      - local: suelo urbanizable sectorizado
        canonical: DEVELOPABLE_SECTORED
        legacy: true
        note: >
          Pre-2017 vocabulary. The string occurs exactly once in the whole law —
          in the preamble sentence that abolishes it: "se suprime la distinción
          urbanizable sectorizado y urbanizable no sectorizado".
      - local: suelo urbanizable no sectorizado
        canonical: RURAL_ORDINARY
        article: DT primera
        legacy: true
        flag: reclassified_by_operation_of_law
        note: >
          THE MOST DANGEROUS ROW FOUND IN THE ELEVEN REGIONS, and until v0.2.0
          this file mapped it to DEVELOPABLE_UNSECTORED. DT primera reclassified
          the land BY OPERATION OF LAW: "los suelos clasificados en los
          instrumentos de ordenación vigentes como urbanizables no sectorizados
          quedan reclasificados como suelo rústico común de reserva", with
          effect from 2017-09-01. So a plan still on the shelf says
          urbanizable, and the statute says rústico — and the old mapping told a
          Canarian owner their land was developable when it had been rural for
          nine years.
          THE ESCAPE HATCH IS REAL AND MUST NOT BE GUESSED AT: municipalities
          had one year to put some of it back as sectorizado, by acuerdo del
          pleno with a reasoned report, plus a cabildo report where the land was
          turístico or estratégico. Whether a given municipality used it is a
          fact about that municipality, not about the string. Where it is
          unknown the answer is confidence='none' and a pointer to the cédula
          urbanística.
          The successor subcategory is SRCR below.
      - local: suelo rústico de protección ambiental
        local_code: SRPA
        canonical: RURAL_PROTECTED
        article: art. 34.a)
        protection_basis: [environmental]
        note: parent category; plans usually carry one of the five subcategories below.
      - local: suelo rústico de protección natural
        local_code: SRPN
        canonical: RURAL_PROTECTED
        article: art. 34.a.1
        protection_basis: [environmental]
      - local: suelo rústico de protección paisajística
        local_code: SRPP
        canonical: RURAL_PROTECTED
        article: art. 34.a.2
        protection_basis: [environmental]
      - local: suelo rústico de protección cultural
