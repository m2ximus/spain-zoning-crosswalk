        article: arts. 81.5, 82.2, 88, 91, 136
        rural_settlement: true
        flag: ambiguous_since_2025_06_08
        note: >
          THE WEAKER SIBLING OF THE NÚCLEO RURAL, and after 2025 a row that must
          refuse rather than answer. art. 81.5: land which, "careciendo de alguno
          de los requisitos del apartado anterior, constituyan un asentamiento
