    notes: >
      Language: official name is Valencian; linguistically the same as Catalan.
      Store as `ca-valencia` so the UI can render the correct official name
      without duplicating the vocabulary.

      THE ONLY REGION WHERE CLASSIFICATION IS A CONSEQUENCE RATHER THAN THE
      PRIMARY ACT. art. 28.1: "Los instrumentos de planeamiento clasifican el
      suelo en suelo urbano, suelo urbanizable y suelo no urbanizable" — but
      arts. 28.2–28.4 read the class off the ZONIFICATION. The plan general
      estructural first zones the territory under art. 25 into zonas rurales,
      zonas urbanizadas and zonas de nuevo desarrollo, and the class follows.
      An ingest that looks for a classification field and does not find one has
      not found a gap; it has found a Valencian plan.

      ANEXO IV §I.1 IS THE FIND OF THIS RELEASE. It fixes a mandatory unified
      nomenclature WITH CODES, and arts. 25.3 and 34.8 make plans conform to it;
      §I.4.b makes the zone code one of these plus a serial number (ZND-RE1,
      ZND-RE2 …). Nothing else in the eleven regions gives a machine-matchable
      code straight out of the statute. Match on the code.

      ZRC-EX AGAINST CANARIAS SRPM IS A HEAD-ON CONTRADICTION BETWEEN TWO
      REGIONS ON THE SAME PHYSICAL FACT. Land whose principal use is mining or
      renewables is COMMON rural in the Comunitat Valenciana (ZRC-EX) and
      PROTECTED rural in Canarias (art. 34.b.4, SRPM). Any cross-region rule of
      the form "extractive use implies protected" is therefore wrong, and
      RURAL_PROTECTED may never be inferred from land use. This is the second
      statutory proof of the permanent hard stop, after Extremadura art. 9.3.

      RURAL_SETTLEMENT IS UNMAPPED HERE and the row that claimed it is gone —
      see removed_mappings. What Valencia has instead is art. 25.4, which
      obliges plans to zone "núcleos históricos tradicionales" as ZUR-NH, a
      category of URBAN land, and art. 231 bis, on the rehabilitation of
      "núcleos rurales tradicionales" or vernacular architecture. Neither is a
      land class.

      MINIMIZACIÓN DE IMPACTO TERRITORIAL IS VALENCIA'S AFO ANALOGUE AND IS NOT
      ON THIS AXIS. arts. 228 (núcleos de viviendas consolidados), 229
      (ordenación), 230 (edificaciones aisladas) and 231 (efectos), plus
      231 bis. art. 230.1: the declaración de situación individualizada
      "implicará la suspensión de la tramitación de los expedientes de
      restablecimiento de la legalidad urbanística", then a licencia de
      minimización, then a licencia de ocupación within four years. It belongs
      on the same axis as Andalucía's AFO and Extremadura's art. 71.3.
      arts. 228 and 229.5 also carry fire and flood conditions — colindancia
      con terreno forestal triggers fire-prevention measures, área inundable
      triggers flood measures for existing buildings — which touch the hazard
      path, not this one.

      PAI: Programas de Actuación Integrada can incorporate non-urbanizable land
      alongside urbanizable, partially blurring the class boundary. Record PAI
      status as a separate flag, not as a classification value.
