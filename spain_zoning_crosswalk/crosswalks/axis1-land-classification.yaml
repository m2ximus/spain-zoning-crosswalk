        canonical: DEVELOPABLE_SECTORED
        article: art. 84.3
      - local: suelo urbanizable sin sectorizar
        canonical: DEVELOPABLE_UNSECTORED
        article: arts. 84.4, 101, 102, 103
        note: >
          `sin sectorizar` is the statute's form; `no sectorizado` appears once,
          in a heading gloss — same discipline as `sin consolidar` above.
          art. 84.4 also carries an automatic promotion: "una vez aprobado el
          correspondiente instrumento de desarrollo, pasará a tener la condición
