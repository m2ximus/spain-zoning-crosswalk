      rústico de especial protección." art. 33 defines the first, art. 34 the
      second. Even so the class cannot be read off a protection overlay:
      art. 34.3 lets a municipality add especial protección for values with NO
      sectoral protection at all, on a favourable sectoral report. Hard stop
      stands here as everywhere.

      RISK LAND IS ORDINARY HERE. art. 33.1.a) puts land subject to natural
      risks in protección ORDINARIA. Cantabria (art. 46.1.b) puts the same fact
      in ESPECIAL protección and Extremadura gives it a category of its own
      (`suelo rústico restringido`). Three regions, three placements, one fact —
      which is why protection_basis carries a `risk` value at all, and why no
      consumer may infer flood or landslide exposure from RURAL_PROTECTED.

      THE URBANIZABLE VINTAGE TRAP IS WORSE THAN IT LOOKS — see the two legacy
      rows. Ley 2/2016 suppressed BOTH halves of the old distinction, not just
      one. Preamble, verbatim: "Suprímese a tradicional categorización do solo
