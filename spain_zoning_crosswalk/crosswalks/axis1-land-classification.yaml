      - local: suelo urbano de núcleo rural
        canonical: URBAN_CONSOLIDATED
        article: arts. 81.4, 82.2, 88, 90, 134
        rural_settlement: true
        note: >
          URBAN LAND WITH A SETTLEMENT RÉGIMEN — the class and the effect point
          different ways, which is exactly what the flag exists for. art. 81.4
          places it inside suelo urbano ("reconocido oficialmente por un
          topónimo", vinculado al sector primario), so that is the canonical
          value. But the régimen is not an urban one: art. 90 allows building,
