      category: both widen what an existing label covers while leaving the
      string identical. Two rows below carry the caveat; one of them must refuse
      rather than answer.

      DT QUINTA IS A CROSSWALK WRITTEN BY THE LEGISLATOR. For municipalities
      whose plan was never adapted to the 2005 refundido it sets out express
      equivalences, and DT segunda gave only six years from 2015-05-06 (to
