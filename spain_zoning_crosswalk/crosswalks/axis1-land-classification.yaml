  # === LA RIOJA ==========================================================
  - region: La Rioja
    ine_ca_code: "17"
    languages: [es]
    law:
      citation: Ley 5/2006, de 2 de mayo, de Ordenación del Territorio y Urbanismo de La Rioja
      boe_url: https://www.boe.es/eli/es-ri/l/2006/05/02/5/con
      in_force_from: 2006-11-04
    class_count: 3
    confidence: verified
    verified_at_version: "0.1.5"
    verified_against: https://www.boe.es/eli/es-ri/l/2006/05/02/5/con
    verified_on: 2026-08-16
    verified_note: >
      Consolidated text as last updated 30/12/2025, read article by article.
      The archived copy is the text tab, which does not carry the modification
      list; how many layers of modification stand behind that date is therefore
      not established by what was read, and no count is asserted here. The date
      itself is: it appears three times in the archived bytes. BOE states that
      consolidated
      texts are informativo and have no valor jurídico; that is enough to
      establish what vocabulary the law uses today, which is all a crosswalk
      row asserts, and it is what `verified` means in this file. It would not
      be enough for an entry-into-force day — 2006-11-04 above is BOE's own
      header field, not a reading of the disposiciones finales.
    priority: 3
    notes: >
      Small (174 municipalities) and its regional SIU was explicitly built to
      OGC standards for integration. Best ratio of coverage to effort in Spain.
      Good candidate for the first END-TO-END region: ingest, crosswalk,
      normativa extraction, Pro tier, all of it, at a size one person can
      finish. Prove the pipeline here before scaling.

      NO RURAL_SETTLEMENT IN LA RIOJA, and this is a real finding rather than
      an omission. Art. 41.1.d) classifies "los núcleos rurales tradicionales
      legalmente asentados en el medio rural" as suelo URBANO even where they
      lack dotaciones and servicios, and art. 42.b) puts them in the
      consolidado category explicitly. So the thing that is a distinct rural
      class in Galicia is, here, ordinary consolidated urban land. Do not
      invent a RURAL_SETTLEMENT row for La Rioja to make the regions look
      symmetrical: it would answer "can I build here" with a transformation
      duty the holder does not have.

      Art. 57 is worth knowing before ingesting: suelo urbanizable no
      delimitado is governed by the regime of suelo no urbanizable genérico
      until it is delimited or a plan parcial is approved. The CLASS is
      urbanizable and the mapping below is correct; the REGIME meanwhile is
      the rural one. Any answer about what may be built there today has to say
      so, which is a resolver concern, not a remapping.

      THE MAPPING BELOW IS THE LAW'S VOCABULARY, NOT NECESSARILY THE PLAN'S.
      DT primera gives municipalities until the end of 2030 to adapt their
      planeamiento to Ley 5/2006, and until they do, "se aplicarán las
      determinaciones del planeamiento vigente que no sean contrarias a esta
      ley". A plan approved under Ley 10/1998 can therefore still be in force
      today using its own terms. Anything matching local strings against these
      rows should carry the plan's vintage and expect misses on unadapted
      plans; a miss there is an unadapted plan, not a defective crosswalk row.

      Art. 39, for municipalities with no plan at all: land that is not urbano
      under art. 41 "tendrá la consideración de suelo no urbanizable", and
      "no existirá suelo urbanizable, en ninguna de sus categorías". So the
      absence of a plan is not the absence of a class. Which of arts. 45/46
      applies is not settled by art. 39, and inferring RURAL_ORDINARY from
      silence would be exactly the guess the article does not make.

      DA segunda: the no-urbanizable protection regime is a FLOOR — "tienen el
      carácter de norma mínima" — and both territorial instruments and
      municipal planning may impose stricter protection on specific zones.
      A parcel can therefore be more protected than its class alone implies.
      Consistent with the rule that a protection layer may refuse and may
      never permit.
    mappings:
      - local: suelo urbano consolidado
        canonical: URBAN_CONSOLIDATED
        article: art. 42.b)
        note: >
          "El resto de suelo urbano tendrá la consideración de suelo urbano
          consolidado, incluidos los núcleos rurales del artículo 41.1.d)."
      - local: suelo urbano no consolidado
        canonical: URBAN_UNCONSOLIDATED
        article: art. 42.a)
        note: >
          Defined by process, not by servicing state — "por estar sometidos a
          procesos integrales de urbanización, a procesos integrales de
          renovación o a procesos de reforma interior" — and only where the
          plan says so expressly.
      - local: suelo urbanizable delimitado
        canonical: DEVELOPABLE_SECTORED
        article: arts. 55.a), 56
      - local: suelo urbanizable no delimitado
        canonical: DEVELOPABLE_UNSECTORED
        article: arts. 55.b), 57
        note: >
          Art. 57: until delimited or a plan parcial is definitively approved,
          "se aplicará el régimen establecido para el suelo no urbanizable
          genérico". Class and regime diverge here.
      - local: suelo no urbanizable genérico
        canonical: RURAL_ORDINARY
        article: art. 46
        note: >
          The law's own term, and the article is permissive — "podrá
          clasificar" — where art. 45 is mandatory.
      - local: suelo no urbanizable especial
        canonical: RURAL_PROTECTED
        article: art. 45
        previous_local: suelo no urbanizable de especial protección
        protection_basis: [sectoral, risk, infrastructure]
        note: >
          protection_basis ADDED at v0.2.0 from the reading already recorded in
          this note, not from a fresh one: art. 45's three mandatory grounds are
          a régimen especial de protección imposed from outside (sectoral),
          geotechnical or morphological risk (risk), and dominio público
          limitations (infrastructure). La Rioja keeps verified_at_version 0.1.5
          because the articles were read then and nothing was re-read now.

          ---
          CORRECTED at v0.1.5. The mapping was always right; the local string
          was not. Ley 5/2006 titles art. 45 "Suelo no urbanizable especial"
          and its body reads "suelo no urbanizable de categoría especial".
          "De especial protección" is Andalusian and Castilian vocabulary that
          La Rioja does not use, and a crosswalk whose whole purpose is to
          translate local terms cannot carry a term the law does not contain —
          a field value read from the regional service would not have matched
          it. The article is mandatory ("clasificará, en todo caso") and covers
          régimen especial de protección incompatible con la transformación,
          geotechnical or morphological risk, and dominio público limitations.

# ---------------------------------------------------------------------------
# OPEN QUESTIONS — resolve before v1.0.0
# ---------------------------------------------------------------------------

open_questions:
  - id: OQ-1
    question: >
      Should URBAN_UNCONSOLIDATED survive as a canonical value given that at
      least three regions have abolished the label?
    recommendation: >
      Keep it. The duty it represents (urbanise and cede before building) is
      real everywhere and is exactly what a buyer needs to know. Where the
      label is abolished, derive the value from the actuación type and set
      label_abolished so the UI can explain the discrepancy honestly.

  - id: OQ-2
    question: >
      Catalunya attaches rural building rights to catalogued BUILDINGS (masies,
      cases rurals) rather than to land polygons. The rest of the model assumes
      rights attach to polygons. How is this represented?
    recommendation: >
      Add a nullable `rights_attach_to` field on the zone record with values
      polygon or catalogued_building. Do not force it into RURAL_SETTLEMENT —
      that would tell a Catalan user they can build on empty rural land.

  - id: OQ-3
    question: >
      Mixed-vintage plans. Andalucía has LOUA-era and LISTA-era plans both in
      force; Extremadura has LSOTEX and LOTUS; Cantabria has 2001 and 2022.
    recommendation: >
      Mandatory: every zone row carries the approval date of its plan AND the
      law in force at approval. Resolve the crosswalk against the law vintage,
      not the current law. This is not optional — get it wrong and the map
      silently misclassifies thousands of polygons.

  - id: OQ-4
    question: Confidence on eleven of seventeen regions is needs_review.
    recommendation: >
      Do not ship any needs_review row to a paying user. Free tier can show
      geometry with a coverage caveat. Verify against BOE consolidated text,
      region by region, in the phase order in the master plan.
    status_at_0_2_0: >
      Inverted. Eleven of seventeen regions are now `verified` and six carry
      needs_review: Andalucía (downgraded at 0.2.0 — it claimed verified while
      recording nothing about what was read), Castilla y León, Castilla-La
      Mancha, Madrid, Navarra and País Vasco. Andalucía is first in the queue,
      both for the AFO wedge and because its LISTA/LOUA transition means its
      rows carry two vintages that its block does not split.

  - id: OQ-6
    question: >
      Is `rural_settlement` on an URBAN_* row the right way to carry a
      settlement that the statute places inside urban land, or should
      RURAL_SETTLEMENT have absorbed those cases with a
      `settlement_position: within_urban`?
    decision: >
      The flag, decided at 0.2.0 on the owner's rule and applied to Murcia art.
      81.4 (`suelo urbano de núcleo rural`), Murcia art. 81.5 (`suelo urbano
      especial`) and Cantabria's núcleo rural after 2024-01-01. The reasoning:
      ingest matches on the CLASS the plan writes on the parcel, and in these
      regions that class is urban. Mapping them RURAL_SETTLEMENT would import
      Galicia's concept — where the settlement genuinely is a class of its own —
      into regions whose statutes say otherwise, which is the same failure mode
      as a vocabulary leak, one level up. `within_urban` was consequently removed
      from the settlement_position vocabulary: a row cannot be RURAL_SETTLEMENT
      and sit inside urban land at the same time, and retiring the value is what
      stops the contradiction being expressible.
    residual_risk: >
      A consumer reading only `canonical` now sees URBAN_CONSOLIDATED for land
      where art. 90 (Murcia) permits only rural-linked uses and housing for the
      resident population until the plan especial arrives. That is a real
      exposure, and the flag is the only thing that closes it, so any resolver
      built on this file MUST branch on `rural_settlement` before answering "what
      may I build here". Both rows carry the régimen verbatim in their notes.
    open: >
      Whether the flag should instead be a fourth canonical value
      (URBAN_SETTLEMENT), which could not be missed by ignoring a column.
      Rejected for 0.2.0 because adding a canonical value breaks every existing
      consumer for three rows in two regions; revisit if more regions turn out
      to have the shape.

  - id: OQ-7
    question: >
      Should `protection_basis` split the grounds it currently folds together —
      `landscape` and `heritage` out of `interest`, `forest` and `agricultural`
      out of `economic`?
    recommendation: >
      Not yet. Each region names its grounds in slightly different words and
      every row already quotes them verbatim in its note, so splitting
      multiplies the vocabulary faster than any consumer can use it while the
      note keeps the detail lossless. The nine values are the coarsest set that
      still answers what consumers actually ask — "protected because of flood
      risk", "protected by the plan rather than by sectoral law". Revisit when
      somebody states a query the current set cannot express.
    warning: >
      Whatever the split, protection_basis is a record of what the STATUTE says
      about a category. It is not evidence about a parcel, and it may never be
      used to infer RURAL_PROTECTED from land use. Two regions prove why:
      extractive land is protected in Canarias (art. 34.b.4, SRPM) and common
      rural in the Comunitat Valenciana (ANEXO IV, ZRC-EX). Same physical fact,
      opposite answers.

  - id: OQ-5
    question: >
      RURAL_ORDINARY vs RURAL_PROTECTED is the distinction with the largest
      legal consequence in this axis — on especially protected land the
      urbanistic infraction generally does not prescribe, so for a building
      raised without licence the answer is not "harder", it is a different
      answer. Which published data source carries the distinction, per
      municipality?
    finding: >
      The ordinario/protegido distinction is NOT carried as a feature layer by
      the Andalusian regional services surveyed on 2026-08-16 (listed under
      sources_checked below), nor by the national land-use layer, which
      publishes SUELO NO URBANIZABLE as one undivided value for the whole
      country and therefore maps only to RURAL_UNSPECIFIED. What the regional
      services do publish is a municipal PLAN REGISTRY — which instrument each
      municipality has in force — and TERRITORIAL protection polygons; the
      per-municipality planeamiento services that exist are WMS images
      published "sin carácter legal". The distinction is expressed only in the
      individual planning instruments. The crosswalk therefore cannot resolve
      it from regional layers.
    survey_date: 2026-08-16
    survey_scope: >
      Andalucía, chosen as the region with the strongest prior case for
      carrying the attribute (largest volume of rural building
      regularisation, and a long-standing regional urbanism information
      system). The finding is stated for the services listed; it is not
      asserted for the other sixteen regions, which have not been surveyed.
    sources_checked:
      - name: SIU — Sistema de Información Urbana (national, Ministerio)
        url: https://www.mivau.gob.es/urbanismo-y-suelo/sistema-de-informacion-urbana
        holds: >
          Municipal land-class polygons for part of the country. SUELO NO
          URBANIZABLE is a single undivided value; no ordinario/protegido
          split at any coverage level.


          SIU carries no rural-settlement or protection distinction; regional
          layers are required for both. SIU is a national harmonisation to
          three classes — urbano, urbanizable, no urbanizable — so the regions
          that hold a rural settlement (núcleo rural, núcleo rural
          tradicional, and their regional equivalents) as a class of its own
          are folded into those three on the way in. The distinction is
          therefore not recoverable from the national layer even where the
          region publishes it: a settlement, like an ordinario/protegido
          split, has to come from that region's own service or from the
          individual planning instrument. Both losses have the same shape and
          the same remedy, one level apart in this axis.


          The polygon download's attribute table nevertheless carries a
          NuclRural column. Its domain and meaning are undocumented — the
          alphanumeric metadata sheet defines every other field, and
          CLASES_SUELO.qmd, the only metadata shipped inside the geometry
          download, has an empty title and an empty abstract. It is recorded
          here so that a consumer who finds the column knows this crosswalk
          does not resolve a land class from it.
      - name: IDEAndalucía — INSPIRE catalogue (CSW / ES API)
        url: https://www.ideandalucia.es/catalogo/inspire/srv/spa
        holds: >
          37 records matching "planeamiento" on the survey date, all of them
          per-municipality WMS image services (largest publisher: Diputación
          de Córdoba), titled "sin carácter legal". Rendered pictures, not
          features.
      - name: SIGC GeoServer (the service behind the VITUA viewer)
        url: https://hcsigc.juntadeandalucia.es/geoserver/CFATV/wfs
        holds: >
          338 layers swept across every workspace. The two planning layers
          are situa01_instrumentos_de_ordenacion_urbanistica (785 features,
          one per municipality: INE code plus the plan FIGURA — PGOU, Normas
          Subsidiarias, Delimitación de Suelo Urbano, sin planeamiento) and
          situa01_protecciones_territoriales_poligonales (2,418 polygons
          carrying norma, nomplan and url). Neither is a municipal
          clasificación del suelo layer.
      - name: SITU@ — Sistema de Información Territorial y Urbanística de Andalucía
        url: https://www.juntadeandalucia.es/organismos/fomentoarticulaciondelterritorioyvivienda/servicios/situa.html
        holds: >
          The public interface over the registry above. It reports the
          instrument in force per municipality, not the classification of
          land within it. Its own notice states that the information "no
          tiene carácter oficial ni sustituye a la proporcionada por el
          Registro Autonómico".
      - name: Portal de datos abiertos de la Junta de Andalucía (CKAN)
        url: https://www.juntadeandalucia.es/datosabiertos/portal/api/3/action/package_search?q=planeamiento&rows=30
        holds: >
          One planning dataset, "Planificación urbanística en Andalucía 2020":
          province-level statistics. Counts of municipalities, no geometry.
    recommendation: >
      Treat this as structural rather than as a coverage gap waiting on a
      download. The distinction is a determination MADE BY the municipal plan,
      and it is read from the plan document (or, for a specific plot, from the
      cédula urbanística or equivalent municipal certificate) — not from a
      regional layer. Implementations should hold RURAL_UNSPECIFIED honestly
      and refuse the question until the plan itself has been ingested for that
      municipality, rather than resolving towards either value.

      And specifically: do NOT derive RURAL_PROTECTED from territorial or
      sectoral protection layers (POT/POTA polygons, protected-area
      registers, Natura 2000, cattle-track or coastal easements). Regional
      laws generally give two independent grounds for special protection —
      protection by specific legislation and protection by territorial or
      urbanistic planning (e.g. Andalucía: LOUA art. 46.1, LISTA art. 14) — so
      such a layer evidences one ground for the ground it covers, and its
      absence evidences nothing. An overlap does not entail that the plan
      classifies the plot as protected, and a mapping that assumes it does
      will tell owners their building can never be regularised on evidence
      that decides no such thing. These layers belong on axis 4 (overlays),
      where they can qualify an answer without becoming one.
    correction_welcome: >
      This is a negative result about published services on a given date, and
      negative results age. If a regional feature service carries the
      ordinario/protegido attribute — in Andalucía or in any other autonomous
      community — please open a pull request adding it here, with the service
      URL, the layer name and the attribute that carries the distinction. A
      single counterexample changes the recommendation above from structural
      to region-specific, which is a change worth making.
