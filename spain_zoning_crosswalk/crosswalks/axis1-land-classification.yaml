      harmonised synthetic layer with its own codes — meaning Catalunya requires
      a two-step crosswalk (municipal code -> MUC code -> canonical) rather than
      the one-step used elsewhere. Building against the hardest case first means
      the schema will absorb the other sixteen.
      Aranese/Occitan is co-official in Val d'Aran; plans there may use it.

      art. 25, verbatim: "Els plans d'ordenació urbanística municipal
      classifiquen tot el sòl del territori corresponent en: a) Sòl urbà.
      b) Sòl no urbanitzable. c) Sòl urbanitzable." Three classes, and note the
      order — Catalunya lists no urbanitzable second, before urbanitzable.

      CATALUNYA HAS NO RURAL SETTLEMENT CLASS, and the row that claimed one is
      gone (see removed_mappings). `nucli rural` occurs ZERO times in TRLUC in
      either language — it is Galician and Cantabrian vocabulary that had leaked
      in. What Catalunya has instead is a BUILDING-level route: "masies i cases
      rurals" identified in "un catàleg específic" by the general or special
      plan (arts. 47.3, 50.2). Rights attach to the catalogued building, not to
      the land; the land stays sòl no urbanitzable and its class does not
      change. Mapping the catalogue onto RURAL_SETTLEMENT would answer "may I
      build a house here" with a yes the holder of an uncatalogued parcel does
      not have. Same discipline as La Rioja's missing settlement row: the
      absence is the finding.

      WHY PROTECTED LAND HERE IS PLAN-RESOLVED AND NOT OVERLAY-READABLE.
      art. 32.a obliges the POUM to classify as sòl no urbanitzable land that
      sectoral legislation or territorial planning calls for; the overlay is the
      TRIGGER for a classification act, it is not itself the classification. A
      protection layer therefore still cannot be read as a class here. Permanent
      hard stop stands.

      THE INFRACTION DOES NOT PRESCRIBE ON ART. 32.a LAND. art. 210.1.a) makes
      acts on "terrenys classificats com a sòl no urbanitzable en virtut del que
      disposa l'article 32.a" nuls de ple dret, and art. 202.6 disapplies the
      prescription periods of arts. 202.1 and 202.4 to the art. 210.1 cases. So
      Catalunya reaches the same result as Andalucía by its own route, and any
      answer about a time-barred building on such land must say so.
    removed_mappings:
      - local: nucli rural / masia o casa rural inclosa en catàleg
        canonical_was: RURAL_SETTLEMENT
        removed_at_version: "0.2.0"
        reason: >
          Two defects in one row. `nucli rural` is not TRLUC vocabulary (0
          occurrences, both languages), and the masia/casa rural catalogue is
          not a land class at all — it is a building-level permission inside
          sòl no urbanitzable. Kept here rather than deleted silently, because a
          consumer who matched on this string before v0.2.0 needs to find out
          what happened to it.
    mappings:
      - local: sòl urbà consolidat
        canonical: URBAN_CONSOLIDATED
        note: 14 verbatim occurrences in DOGC 5686; subdividing article not read.
      - local: sòl urbà no consolidat
        canonical: URBAN_UNCONSOLIDATED
        note: 23 verbatim occurrences in DOGC 5686; subdividing article not read.
      - local: sòl urbanitzable delimitat
        canonical: DEVELOPABLE_SECTORED
        note: 12 verbatim occurrences in DOGC 5686; subdividing article not read.
      - local: sòl urbanitzable no delimitat
        canonical: DEVELOPABLE_UNSECTORED
        note: 11 verbatim occurrences in DOGC 5686; subdividing article not read.
      - local: sòl no urbanitzable
        canonical: RURAL_ORDINARY
        article: arts. 25.b), 214.a)
        note: >
          The law's own residual phrasing is negative: art. 214.a) speaks of
          "sòl no urbanitzable no sotmès a cap règim de protecció especial".
          There is no positive label such as `comú` or `ordinari`, so a Catalan
          plan will carry the bare class name here and its own zone name on top.
      - local: sòl no urbanitzable sotmès a un règim de protecció especial
        canonical: RURAL_PROTECTED
        article: arts. 32.a), 213.a)
        protection_basis: [sectoral, plan]
        previous_local: sòl no urbanitzable de protecció especial
        note: >
          CORRECTED at v0.2.0. The mapping is right and the string was not: the
          exact previous string occurs ZERO times in the authentic Catalan text.
          What the law says is that the land is "objecte d'algun règim de
          protecció especial, d'acord amb el que estableix l'article 32.a"
          (art. 213.a), against the complement in art. 214.a). Note the
          consequence for matching: TRLUC gives this figure no short label, so
          NEITHER string will appear as a field value — a Catalan plan writes
          its own zone name (clau) and the classification has to come from the
          POUM's art. 32.a determination, not from string equality. This row
          exists to say what the canonical value means in Catalunya, not to be
          matched on.
          protection_basis is [sectoral, plan] because art. 32.a's two triggers
          are sectoral legislation and territorial planning; the specific value
          protected (natural, landscape, agricultural) is not fixed by the class
          and must not be inferred from it.

