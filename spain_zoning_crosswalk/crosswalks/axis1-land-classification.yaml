      classification rule, so it moves no row on this axis. Recorded because a
      silent absence looks like something was missed.

      MOST IMPORTANT REGION FOR THIS PROJECT AFTER CATALUNYA — not for its size
      but because Murcia has already published a technical instruction
      standardising its planning instruments and mapping them to HILUCS. It is
      the only region that has publicly done the work this crosswalk is doing.
      Read it before finalising axis 2; align with it wherever defensible.
      Murcia is also running an INSPIRE Planned Land Use pilot across twelve
