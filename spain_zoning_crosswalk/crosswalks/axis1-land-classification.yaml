      asentamiento de población tradicional reconocido oficialmente por un
      topónimo y especialmente vinculado a las actividades del sector primario."
      The class the plan writes on the parcel is URBAN, and ingest matches on
      the class, so the row maps to the URBAN_* family and carries
      `rural_settlement: true` rather than to RURAL_SETTLEMENT. Mapping it rural
