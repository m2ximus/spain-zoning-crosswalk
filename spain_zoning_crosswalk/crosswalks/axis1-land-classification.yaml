      Articles read: 25, 26, 28, 34.8, 76, 81, 228, 229, 230, 231, 231 bis,
      ANEXO IV §I.1 and §I.4.b, and the decreto legislativo's disposición final
      única. THREE of the six rows this file carried were wrong, and the region
      turned out to hold the single most ingestible artefact found across the
      eleven: a statutory coded zone nomenclature.
      BOTH GRADES WERE NECESSARY, and this is the case migration 024 was
      written for: `sòl` occurs ZERO times in BOE's text, because BOE publishes
